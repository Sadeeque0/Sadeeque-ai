<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sadeeque AI Orders</title>
<link rel="stylesheet" href="./styles.css">
<style>
:root{--blue:#149bea;--text:#102033;--muted:#647689}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5faff;color:var(--text)}
body{overflow-x:hidden}.dashboard{min-height:100vh;background:radial-gradient(circle at 20% 15%,rgba(20,155,234,.10),transparent 30%),radial-gradient(circle at 85% 35%,rgba(20,155,234,.08),transparent 28%),linear-gradient(135deg,#fbfdff 0%,#eef7ff 55%,#f8fcff 100%)}
.menu-button{position:fixed;z-index:120;top:18px;left:18px;width:44px;height:44px;border:1px solid rgba(255,255,255,.95);border-radius:14px;background:rgba(255,255,255,.72);backdrop-filter:blur(18px);box-shadow:0 10px 28px rgba(45,125,190,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0}.menu-button span{width:19px;height:2px;border-radius:4px;background:#203448}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(25,65,100,.16);backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:.22s}.overlay.open{opacity:1;visibility:visible}
.sidebar{position:fixed;z-index:110;top:0;left:0;width:285px;height:100vh;padding:22px 15px 16px;display:flex;flex-direction:column;transform:translateX(-105%);transition:.26s cubic-bezier(.2,.8,.2,1);background:rgba(255,255,255,.82);border-right:1px solid rgba(120,170,220,.22);backdrop-filter:blur(28px);box-shadow:18px 0 45px rgba(40,120,190,.14)}.sidebar.open{transform:translateX(0)}
.sidebar-brand{display:flex;align-items:center;gap:11px;padding:3px 9px 20px;border-bottom:1px solid rgba(120,170,220,.18);margin-bottom:14px}.sidebar-brand img{width:42px;height:42px;border-radius:13px;object-fit:cover}.sidebar-brand strong{font-size:15px;letter-spacing:.08em}.close-sidebar{margin-left:auto;width:34px;height:34px;border:0;border-radius:11px;background:rgba(235,245,253,.75);color:#526477;font-size:24px;cursor:pointer}
.nav{display:flex;flex-direction:column;gap:5px;overflow:auto;padding-right:2px}.nav a{display:flex;align-items:center;min-height:43px;text-decoration:none;color:#526477;padding:11px 13px;border-radius:13px;font-size:14px;font-weight:650}.nav a:hover,.nav a.active{color:#087fe9;background:rgba(30,155,240,.08)}.logout-wrap{margin-top:auto;padding-top:14px;border-top:1px solid rgba(120,170,220,.18)}.logout{width:100%;border:0;background:rgba(255,255,255,.5);color:#526477;text-align:left;padding:12px 13px;border-radius:13px;font:600 14px inherit;cursor:pointer}
.main{min-height:100vh;padding:86px 24px 40px;max-width:1180px;margin:0 auto}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.topbar h1{margin:0;font-size:30px}.tools{display:flex;gap:10px;flex-wrap:wrap}.search{width:min(420px,70vw);padding:12px 15px;border-radius:14px;border:1px solid rgba(120,170,220,.25);background:rgba(255,255,255,.78);outline:0}
.orders{display:grid;gap:12px}.order-card{position:relative;display:grid;grid-template-columns:1fr auto;gap:14px;padding:18px 52px 18px 19px;border:1px solid rgba(255,255,255,.92);border-radius:19px;background:rgba(255,255,255,.72);box-shadow:0 16px 40px rgba(54,130,190,.09),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(18px);cursor:pointer}.order-card.unread{border-color:rgba(20,155,234,.38);box-shadow:0 16px 40px rgba(20,155,234,.13)}.order-card.pinned{outline:1px solid rgba(20,155,234,.24)}.order-main{min-width:0}.new-dot{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:2px;color:#e53935;font-size:14px;line-height:1}.new-dot::after{content:'⚠';font-size:13px}.new-dot[title]{cursor:help}.line{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.bot{font-weight:800}.code{font-size:12px;color:#6d8194}.meta{font-size:12px;color:#73879a}.summary{margin-top:8px;color:#526477;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{display:inline-flex;padding:5px 9px;border-radius:999px;background:#edf7ff;color:#087fe9;font-size:11px;font-weight:800;text-transform:uppercase}.status.cancelled{background:#fff1f1;color:#c62828}.status.in_progress{background:#fff8e8;color:#a56800}.status.new{background:#eefcf7;color:#13835b}.customer{font-size:13px;color:#3d5368;margin-top:6px}.more{position:absolute;right:12px;top:12px;width:34px;height:34px;border:0;border-radius:11px;background:rgba(238,247,253,.82);color:#53687a;font-size:20px;cursor:pointer}.menu{position:absolute;z-index:20;right:12px;top:48px;min-width:170px;padding:7px;border-radius:14px;background:#fff;border:1px solid #dbe7f0;box-shadow:0 18px 45px rgba(30,80,120,.18);display:none}.menu.open{display:block}.menu button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:10px;color:#42576a;cursor:pointer}.menu button:hover{background:#f1f8fd}.menu .danger{color:#c62828}
.empty{padding:45px;text-align:center;color:#718295;border:1px dashed #c9d9e6;border-radius:20px;background:rgba(255,255,255,.48)}
.detail{display:none}.detail.open{display:block}.detail-panel{width:100%;min-height:calc(100vh - 126px);border-radius:25px;background:rgba(255,255,255,.82);box-shadow:0 20px 60px rgba(25,70,110,.12);padding:24px}.detail-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.close-detail{width:38px;height:38px;border:0;border-radius:12px;background:#eef6fc;font-size:22px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.info{padding:13px 15px;border-radius:14px;background:#f7fbfe;border:1px solid #e3edf4}.label{font-size:11px;color:#718295;text-transform:uppercase;font-weight:800}.value{margin-top:5px;white-space:pre-wrap;word-break:break-word}.tabs{display:flex;gap:8px;margin:18px 0 0;border-bottom:1px solid #e2edf4}.tab{border:0;background:transparent;padding:12px 15px;border-radius:12px 12px 0 0;color:#647689;font-weight:800;cursor:pointer}.tab.active{color:#087fe9;background:#eef8ff}.tab-panel{display:none;padding-top:18px}.tab-panel.active{display:block}.summary-only{padding:18px;border:1px solid #e3edf4;border-radius:16px;background:#f8fbfd;white-space:pre-wrap;line-height:1.6}.conversation{display:grid;gap:8px}.bubble{padding:11px 13px;border-radius:14px;background:#f3f8fc;white-space:pre-wrap;word-break:break-word;line-height:1.5}.bubble.user{background:#edf7ff}.bubble .role{font-size:10px;text-transform:uppercase;font-weight:800;color:#6c8295;margin-bottom:4px}.images{display:flex;gap:10px;flex-wrap:wrap}.images img{width:180px;height:180px;object-fit:cover;border-radius:14px;border:1px solid #dce8f0}.detail-actions{display:flex;gap:8px;align-items:center}.detail-more{width:38px;height:38px;border:0;border-radius:12px;background:#eef6fc;font-size:20px;cursor:pointer}.detail-menu{position:relative}.detail-menu .menu{position:absolute;right:0;top:44px}.back-button{border:0;background:#eef6fc;color:#365066;padding:10px 13px;border-radius:12px;font-weight:800;cursor:pointer}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.main{padding:80px 14px 26px}.topbar{align-items:flex-start;flex-direction:column;gap:12px}.search{width:100%}.grid{grid-template-columns:1fr}.detail-panel{padding:17px}.order-card{padding-right:50px}.tabs{overflow-x:auto}.tab{white-space:nowrap}.images img{width:130px;height:130px}}
</style>
</head>
<body>
<div class="dashboard">
<button class="menu-button" id="menuButton" aria-label="Open sidebar"><span></span><span></span><span></span></button>
<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar"><div class="sidebar-brand"><img id="sidebarLogo" alt="Sadeeque AI logo"><strong>SADEEQUE AI</strong><button class="close-sidebar" id="closeSidebar">×</button></div>
<nav class="nav"><a href="./dashboard.html">Sadeeque AI Homepage</a><a href="./all-bots.html">All Bots</a><a href="./create-bot.html">Create Bot</a><a href="./instructions.html">Instructions</a><a href="./knowledge.html">Knowledge</a><a href="./external-support.html">External Support Knowledge</a><a href="./api-keys.html">API Keys</a><a class="active" href="./orders.html">Orders</a><a href="#">Settings</a><a href="#">Health</a><a href="#">Webs Join</a></nav>
<div class="logout-wrap"><button class="logout" id="logoutButton">Log out</button></div></aside>
<main class="main">
<div id="listView">
  <div class="topbar"><h1>Orders</h1><div class="tools"><input id="search" class="search" placeholder="Search customer, phone, order ID or bot..."></div></div>
  <div id="orders" class="orders"><div class="empty">Loading orders…</div></div>
</div>
<div id="detail" class="detail">
<section class="detail-panel">
  <div class="detail-head">
    <div>
      <button class="back-button" id="backOrders">← Back to Orders</button>
      <h2 id="dTitle" style="margin:15px 0 5px">Order Details</h2>
      <div id="dCode" class="code"></div>
    </div>
    <div class="detail-actions">
      <div class="detail-menu"><button class="detail-more" id="detailMore" aria-label="Order actions">⋮</button>
        <div class="menu" id="detailMenu">
          <button data-detail-action="pin" id="detailPin">Pin</button>
          <button data-detail-action="read" id="detailRead">Mark as unread</button>
          <button data-detail-action="cancel">Cancel</button>
          <button class="danger" data-detail-action="delete">Delete</button>
        </div>
      </div>
    </div>
  </div>
  <div id="dGrid" class="grid"></div>
  <div class="tabs">
    <button class="tab active" data-tab="summary">Summary</button>
    <button class="tab" data-tab="chat">Chat History</button>
    <button class="tab" data-tab="uploads">Upload</button>
  </div>
  <div id="tab-summary" class="tab-panel active"><div id="dSummary" class="summary-only"></div></div>
  <div id="tab-chat" class="tab-panel"><div id="dConversation" class="conversation"></div></div>
  <div id="tab-uploads" class="tab-panel"><div id="dImages" class="images"></div></div>
</section>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client=supabase.createClient('https://elvvupvcfdstkqpdtxxr.supabase.co','sb_publishable_V_tJaxkTECrDUig_kFT7zw_VWPd8L4C');
const $=id=>document.getElementById(id);let rows=[];let openMenu=null;
function openSidebar(){sidebar.classList.add('open');overlay.classList.add('open')}function closeSidebar(){sidebar.classList.remove('open');overlay.classList.remove('open')}
const sidebar=$('sidebar'),overlay=$('overlay');$('menuButton').onclick=()=>sidebar.classList.contains('open')?closeSidebar():openSidebar();$('closeSidebar').onclick=closeSidebar;overlay.onclick=closeSidebar;$('logoutButton').onclick=async()=>{await client.auth.signOut();location.href='./'};
async function logo(){try{const r=await fetch('./index.html?logo=1',{cache:'no-store'}),h=await r.text(),m=h.match(/data:image\/jpeg;base64,([^\"]+)/);if(m)$('sidebarLogo').src='data:image/jpeg;base64,'+m[1]}catch{}}
function fmt(v){return v?new Date(v).toLocaleString(): '—'}
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function statusLabel(s){return s==='in_progress'?'In Progress':s.charAt(0).toUpperCase()+s.slice(1)}
function render(){
 const q=$('search').value.trim().toLowerCase();
 const list=rows.filter(o=>[o.order_code,o.customer_name,o.customer_phone,o.bot_id,o.bot_name,o.summary].some(v=>String(v||'').toLowerCase().includes(q)))
 .sort((a,b)=>(Number(b.is_pinned)-Number(a.is_pinned))||new Date(b.created_at)-new Date(a.created_at));
 $('orders').innerHTML=list.length?list.map(o=>\`<article class="order-card \${o.is_read?'':'unread'} \${o.is_pinned?'pinned':''}" data-id="\${o.id}">
 <div class="order-main">
   <div class="line">
     \${o.is_read?'':'<span class="new-dot" title="New order" aria-label="New"></span>'}
     <span class="bot">\${esc(o.bot_name||'Bot name unavailable')}</span>
     <span class="code">ID: \${esc(o.bot_id)}</span>
     <span class="code">\${esc(o.order_code)}</span>
     <span class="status \${esc(o.status)}">\${esc(statusLabel(o.status))}</span>
   </div>
   <div class="customer">\${esc(o.customer_name||'Customer not identified')} • \${esc(o.customer_phone||'No phone provided')} • \${esc(fmt(o.created_at))}</div>
   <div class="summary">\${esc(o.summary||'Order conversation')}</div>
 </div>
 <button type="button" class="more" data-more="\${o.id}" aria-label="Order actions">⋮</button>
 <div class="menu" data-menu="\${o.id}">
   <button type="button" data-action="pin" data-id="\${o.id}">\${o.is_pinned?'Unpin':'Pin'}</button>
   <button type="button" data-action="read" data-id="\${o.id}">\${o.is_read?'Mark as unread':'Mark as read'}</button>
   <button type="button" data-action="cancel" data-id="\${o.id}">Cancel</button>
   <button type="button" class="danger" data-action="delete" data-id="\${o.id}">Delete</button>
 </div>
 </article>\`).join(''):'<div class="empty">No orders found.</div>';

 document.querySelectorAll('.order-card').forEach(x=>x.onclick=e=>{
   if(e.target.closest('.more,.menu'))return;
   openOrder(x.dataset.id);
 });
 document.querySelectorAll('.more').forEach(b=>b.onclick=e=>{
   e.stopPropagation();
   document.querySelectorAll('.menu').forEach(m=>m.classList.remove('open'));
   const m=document.querySelector(\`[data-menu="\${b.dataset.more}"]\`);
   if(m)m.classList.add('open');
 });
 document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async e=>{
   e.stopPropagation();
   document.querySelectorAll('.menu').forEach(m=>m.classList.remove('open'));
   await action(b.dataset.id,b.dataset.action);
 });
}

async function load(){
  $('orders').innerHTML='<div class="empty">Loading orders…</div>';
  try{
    const {data:{session},error:sessionError}=await client.auth.getSession();
    if(sessionError) throw sessionError;
    if(!session){ location.href='./'; return; }

    const {data,error}=await client.from('orders')
      .select('id,order_code,bot_id,user_key,customer_name,customer_phone,customer_email,customer_details,summary,important_details,status,is_pinned,is_read,source_started_at,source_completed_at,created_at,updated_at,cancelled_at')
      .order('created_at',{ascending:false});

    if(error) throw error;

    rows=(data||[]).map(x=>({...x,bot_name:'Bot name unavailable'}));
    render();

    // Load bot names separately; failure here must never block Orders.
    const ids=[...new Set(rows.map(x=>x.bot_id).filter(Boolean))];
    if(ids.length){
      try{
        const {data:bs}=await client.from('bots').select('bot_id,bot_name').in('bot_id',ids);
        const bots={};
        (bs||[]).forEach(b=>bots[b.bot_id]=b.bot_name);
        rows=rows.map(x=>({...x,bot_name:bots[x.bot_id]||'Bot name unavailable'}));
        render();
      }catch(e){ console.warn('Bot names unavailable',e); }
    }
  }catch(error){
    console.error('Orders load failed:',error);
    $('orders').innerHTML='<div class="empty">Unable to load orders: '+esc(error?.message||'Unknown error')+'</div>';
  }
}

async function action(id,a){
 const row=rows.find(x=>x.id===id);
 if(!row)return;
 if(a==='delete'){
   if(!confirm('Delete this order permanently?'))return;
   const{data:ims,error:ie}=await client.from('order_images').select('storage_path').eq('order_id',id);
   if(ie)return alert(ie.message||'Unable to prepare order deletion.');
   const paths=(ims||[]).map(x=>x.storage_path).filter(Boolean);
   if(paths.length){
     const{error:se}=await client.storage.from('order-images').remove(paths);
     if(se)return alert(se.message||'Unable to delete order uploads.');
   }
   const{data,error}=await client.rpc('delete_order',{p_order_id:id});
   if(error)return alert(error.message||'Delete failed.');
   if(data===false)return alert('Order was not found.');
   const i=rows.findIndex(x=>x.id===id);if(i>=0)rows.splice(i,1);
   if($('detail').classList.contains('open'))backToOrders();else render();
   return;
 }
 if(a==='cancel'&&!confirm('Cancel this order?'))return;
 const pAction=a==='pin'?(row.is_pinned?'unpin':'pin'):a==='read'?(row.is_read?'unread':'read'):'cancel';
 const{data,error}=await client.rpc('order_set_state',{p_order_id:id,p_action:pAction});
 if(error)return alert(error.message||'Action failed.');
 const i=rows.findIndex(x=>x.id===id);if(i>=0)rows[i]=data;
 if($('detail').classList.contains('open'))openOrder(id);else render();
}

async function openOrder(id){
 const o=rows.find(x=>x.id===id);if(!o)return;
 if(!o.is_read){
   const{data,error}=await client.rpc('order_set_state',{p_order_id:id,p_action:'read'});
   if(!error){const i=rows.findIndex(x=>x.id===id);if(i>=0)rows[i]=data;}
 }
 const fresh=rows.find(x=>x.id===id)||o;
 $('dTitle').textContent=fresh.bot_name||'Order Details';
 $('dCode').textContent=fresh.order_code;
 $('dGrid').innerHTML=[
   ['Bot Name',fresh.bot_name||'Bot name unavailable'],
   ['Bot ID',fresh.bot_id],
   ['Customer',fresh.customer_name||'Not provided'],
   ['Phone',fresh.customer_phone||'Not provided'],
   ['Date',fmt(fresh.created_at)],
   ['Status',statusLabel(fresh.status)],
   ['Order ID',fresh.order_code],
   ['Pinned',fresh.is_pinned?'Yes':'No']
 ].map(x=>'<div class="info"><div class="label">'+esc(x[0])+'</div><div class="value">'+esc(x[1])+'</div></div>').join('');
 $('dSummary').textContent=fresh.summary||'No summary available.';
 $('dConversation').innerHTML='<div class="info">Loading chat history…</div>';
 $('dImages').innerHTML='<div class="info">Loading uploads…</div>';
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab==='summary'));
 document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id==='tab-summary'));
 $('detailPin').textContent=fresh.is_pinned?'Unpin':'Pin';
 $('detailRead').textContent=fresh.is_read?'Mark as unread':'Mark as read';
 $('detail').classList.add('open');$('listView').style.display='none';
 const{data:msgs}=await client.from('order_messages').select('*').eq('order_id',id).order('created_at',{ascending:true});
 $('dConversation').innerHTML=(msgs||[]).map(m=>'<div class="bubble '+(m.role==='user'?'user':'')+'"><div class="role">'+esc(m.role)+'</div>'+esc(m.content)+'</div>').join('')||'<div class="info">No conversation stored.</div>';
 const{data:ims}=await client.from('order_images').select('*').eq('order_id',id).order('created_at',{ascending:true});
 $('dImages').innerHTML='';
 for(const im of (ims||[])){
   const s=await client.storage.from('order-images').createSignedUrl(im.storage_path,3600);
   if(!s.error){const img=document.createElement('img');img.src=s.data.signedUrl;img.alt='Customer upload';$('dImages').appendChild(img)}
 }
 if(!(ims||[]).length)$('dImages').innerHTML='<div class="info">No customer uploads stored for this order.</div>';
}

function backToOrders(){
 $('detail').classList.remove('open');$('listView').style.display='block';render();
}

$('backOrders').onclick=backToOrders;
$('detailMore').onclick=e=>{e.stopPropagation();$('detailMenu').classList.toggle('open')};
document.querySelectorAll('[data-detail-action]').forEach(b=>b.onclick=async e=>{
 e.stopPropagation();
 $('detailMenu').classList.remove('open');
 const id=$('dCode').textContent;
 const row=rows.find(x=>x.order_code===id);
 if(row)await action(row.id,b.dataset.detailAction);
});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));
 t.classList.add('active');$('tab-'+t.dataset.tab).classList.add('active');
});
$('search').oninput=render;
document.addEventListener('click',e=>{
 if(!e.target.closest('.more,.menu'))document.querySelectorAll('.menu').forEach(m=>m.classList.remove('open'));
});
logo();load();
</script></body></html>
