<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sadeeque AI Orders</title>
<link rel="stylesheet" href="./styles.css">
<style>
:root{--blue:#149bea;--text:#102033;--muted:#647689}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5faff;color:var(--text)}
body{overflow-x:hidden}.dashboard{min-height:100vh;background:radial-gradient(circle at 20% 15%,rgba(20,155,234,.10),transparent 30%),radial-gradient(circle at 85% 35%,rgba(20,155,234,.08),transparent 28%),linear-gradient(135deg,#fbfdff 0%,#eef7ff 55%,#f8fcff 100%)}
.menu-button{position:fixed;z-index:120;top:18px;left:18px;width:44px;height:44px;border:1px solid rgba(255,255,255,.95);border-radius:14px;background:rgba(255,255,255,.72);backdrop-filter:blur(18px);box-shadow:0 10px 28px rgba(45,125,190,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0}.menu-button span{width:19px;height:2px;border-radius:4px;background:#203448}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(25,65,100,.16);backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:.22s}.overlay.open{opacity:1;visibility:visible}
.sidebar{position:fixed;z-index:110;top:0;left:0;width:285px;height:100vh;padding:22px 15px 16px;display:flex;flex-direction:column;transform:translateX(-105%);transition:.26s cubic-bezier(.2,.8,.2,1);background:rgba(255,255,255,.82);border-right:1px solid rgba(120,170,220,.22);backdrop-filter:blur(28px);box-shadow:18px 0 45px rgba(40,120,190,.14)}.sidebar.open{transform:translateX(0)}
.sidebar-brand{display:flex;align-items:center;gap:11px;padding:3px 9px 20px;border-bottom:1px solid rgba(120,170,220,.18);margin-bottom:14px}.sidebar-brand img{width:42px;height:42px;border-radius:13px;object-fit:cover}.sidebar-brand strong{font-size:15px;letter-spacing:.08em}.close-sidebar{margin-left:auto;width:34px;height:34px;border:0;border-radius:11px;background:rgba(235,245,253,.75);color:#526477;font-size:24px;cursor:pointer}
.nav{display:flex;flex-direction:column;gap:5px;overflow:auto;padding-right:2px}.nav a{display:flex;align-items:center;min-height:43px;text-decoration:none;color:#526477;padding:11px 13px;border-radius:13px;font-size:14px;font-weight:650}.nav a:hover,.nav a.active{color:#087fe9;background:rgba(30,155,240,.08)}.logout-wrap{margin-top:auto;padding-top:14px;border-top:1px solid rgba(120,170,220,.18)}.logout{width:100%;border:0;background:rgba(255,255,255,.5);color:#526477;text-align:left;padding:12px 13px;border-radius:13px;font:600 14px inherit;cursor:pointer}
.main{min-height:100vh;padding:86px 24px 40px;max-width:1180px;margin:0 auto}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.topbar h1{margin:0;font-size:30px}.tools{display:flex;gap:10px;flex-wrap:wrap}.search{width:min(420px,70vw);padding:12px 15px;border-radius:14px;border:1px solid rgba(120,170,220,.25);background:rgba(255,255,255,.78);outline:0}
.orders{display:grid;gap:12px}.order-card{position:relative;display:grid;grid-template-columns:1fr auto;gap:14px;padding:18px 52px 18px 19px;border:1px solid rgba(255,255,255,.92);border-radius:19px;background:rgba(255,255,255,.72);box-shadow:0 16px 40px rgba(54,130,190,.09),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(18px);cursor:pointer}.order-card.unread{border-color:rgba(20,155,234,.38);box-shadow:0 16px 40px rgba(20,155,234,.13)}.order-card.pinned{outline:1px solid rgba(20,155,234,.24)}.order-main{min-width:0}.line{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.bot{font-weight:800}.code{font-size:12px;color:#6d8194}.meta{font-size:12px;color:#73879a}.summary{margin-top:8px;color:#526477;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{display:inline-flex;padding:5px 9px;border-radius:999px;background:#edf7ff;color:#087fe9;font-size:11px;font-weight:800;text-transform:uppercase}.status.cancelled{background:#fff1f1;color:#c62828}.status.in_progress{background:#fff8e8;color:#a56800}.status.new{background:#eefcf7;color:#13835b}.customer{font-size:13px;color:#3d5368;margin-top:6px}.more{position:absolute;right:12px;top:12px;width:34px;height:34px;border:0;border-radius:11px;background:rgba(238,247,253,.82);color:#53687a;font-size:20px;cursor:pointer}.menu{position:absolute;z-index:20;right:12px;top:48px;min-width:170px;padding:7px;border-radius:14px;background:#fff;border:1px solid #dbe7f0;box-shadow:0 18px 45px rgba(30,80,120,.18);display:none}.menu.open{display:block}.menu button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:10px;color:#42576a;cursor:pointer}.menu button:hover{background:#f1f8fd}.menu .danger{color:#c62828}
.empty{padding:45px;text-align:center;color:#718295;border:1px dashed #c9d9e6;border-radius:20px;background:rgba(255,255,255,.48)}
.detail{position:fixed;inset:0;z-index:200;background:rgba(15,44,70,.22);backdrop-filter:blur(5px);display:none;padding:28px}.detail.open{display:grid;place-items:center}.detail-panel{width:min(980px,96vw);max-height:92vh;overflow:auto;border-radius:25px;background:#fff;box-shadow:0 30px 80px rgba(25,70,110,.25);padding:24px}.detail-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.close-detail{width:38px;height:38px;border:0;border-radius:12px;background:#eef6fc;font-size:22px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.info{padding:13px 15px;border-radius:14px;background:#f7fbfe;border:1px solid #e3edf4}.label{font-size:11px;color:#718295;text-transform:uppercase;font-weight:800}.value{margin-top:5px;white-space:pre-wrap;word-break:break-word}.block{margin-top:16px}.block h3{font-size:15px;margin:0 0 8px}.conversation{display:grid;gap:8px}.bubble{padding:11px 13px;border-radius:14px;background:#f3f8fc;white-space:pre-wrap;word-break:break-word;line-height:1.5}.bubble.user{background:#edf7ff}.bubble .role{font-size:10px;text-transform:uppercase;font-weight:800;color:#6c8295;margin-bottom:4px}.images{display:flex;gap:10px;flex-wrap:wrap}.images img{width:150px;height:150px;object-fit:cover;border-radius:14px;border:1px solid #dce8f0}
@media(max-width:600px){.main{padding:80px 14px 26px}.topbar{align-items:flex-start;flex-direction:column;gap:12px}.search{width:100%}.grid{grid-template-columns:1fr}.detail{padding:10px}.detail-panel{padding:17px}.order-card{padding-right:50px}}
</style>
</head>
<body>
<div class="dashboard">
<button class="menu-button" id="menuButton" aria-label="Open sidebar"><span></span><span></span><span></span></button>
<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar"><div class="sidebar-brand"><img id="sidebarLogo" alt="Sadeeque AI logo"><strong>SADEEQUE AI</strong><button class="close-sidebar" id="closeSidebar">×</button></div>
<nav class="nav"><a href="./dashboard.html">Sadeeque AI Homepage</a><a href="./all-bots.html">All Bots</a><a href="./create-bot.html">Create Bot</a><a href="./instructions.html">Instructions</a><a href="./knowledge.html">Knowledge</a><a href="./external-support.html">External Support Knowledge</a><a href="./api-keys.html">API Keys</a><a class="active" href="./orders.html">Orders</a><a href="#">Settings</a><a href="#">Health</a><a href="#">Webs Join</a></nav>
<div class="logout-wrap"><button class="logout" id="logoutButton">Log out</button></div></aside>
<main class="main"><div class="topbar"><h1>Orders</h1><div class="tools"><input id="search" class="search" placeholder="Search customer, phone, order ID or bot..."></div></div><div id="orders" class="orders"><div class="empty">Loading orders…</div></div></main></div>
<div id="detail" class="detail"><section class="detail-panel"><div class="detail-head"><div><h2 id="dTitle" style="margin:0 0 5px">Order Details</h2><div id="dCode" class="code"></div></div><button class="close-detail" id="closeDetail">×</button></div><div id="dGrid" class="grid"></div><div class="block"><h3>Important Order Details</h3><div id="dImportant" class="info"></div></div><div class="block"><h3>Customer Details</h3><div id="dCustomer" class="info"></div></div><div class="block"><h3>Conversation</h3><div id="dConversation" class="conversation"></div></div><div class="block"><h3>Images</h3><div id="dImages" class="images"></div></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client=supabase.createClient('https://elvvupvcfdstkqpdtxxr.supabase.co','sb_publishable_V_tJaxkTECrDUig_kFT7zw_VWPd8L4C');
const $=id=>document.getElementById(id);let rows=[];let openMenu=null;
function openSidebar(){sidebar.classList.add('open');overlay.classList.add('open')}function closeSidebar(){sidebar.classList.remove('open');overlay.classList.remove('open')}
const sidebar=$('sidebar'),overlay=$('overlay');$('menuButton').onclick=()=>sidebar.classList.contains('open')?closeSidebar():openSidebar();$('closeSidebar').onclick=closeSidebar;overlay.onclick=closeSidebar;$('logoutButton').onclick=async()=>{await client.auth.signOut();location.href='./'};
async function logo(){try{const r=await fetch('./index.html?logo=1',{cache:'no-store'}),h=await r.text(),m=h.match(/data:image\/jpeg;base64,([^\"]+)/);if(m)$('sidebarLogo').src='data:image/jpeg;base64,'+m[1]}catch{}}
function fmt(v){return v?new Date(v).toLocaleString(): '—'}
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function statusLabel(s){return s==='in_progress'?'In Progress':s.charAt(0).toUpperCase()+s.slice(1)}
function render(){const q=$('search').value.trim().toLowerCase();const list=rows.filter(o=>[o.order_code,o.customer_name,o.customer_phone,o.bot_id,o.summary].some(v=>String(v||'').toLowerCase().includes(q))).sort((a,b)=>(Number(b.is_pinned)-Number(a.is_pinned))||new Date(b.created_at)-new Date(a.created_at));$('orders').innerHTML=list.length?list.map(o=>`<article class="order-card ${o.is_read?'':'unread'} ${o.is_pinned?'pinned':''}" data-id="${o.id}"><div class="order-main"><div class="line"><span class="bot">${esc(o.bot_name||o.bot_id)}</span><span class="code">${esc(o.bot_id)}</span><span class="code">${esc(o.order_code)}</span><span class="status ${esc(o.status)}">${esc(statusLabel(o.status))}</span></div><div class="customer">${esc(o.customer_name||'Customer not identified')} • ${esc(o.customer_phone||'No phone provided')} • ${esc(fmt(o.created_at))}</div><div class="summary">${esc(o.summary||'Order conversation')}</div></div><button class="more" data-more="${o.id}" aria-label="Order actions">⋮</button><div class="menu" data-menu="${o.id}"><button data-action="pin" data-id="${o.id}">${o.is_pinned?'Unpin':'Pin'}</button><button data-action="read" data-id="${o.id}">${o.is_read?'Mark as unread':'Mark as read'}</button><button data-action="cancel" data-id="${o.id}">Cancel</button><button class="danger" data-action="delete" data-id="${o.id}">Delete</button></div></article>`).join(''):'<div class="empty">No orders found.</div>';document.querySelectorAll('.order-card').forEach(x=>x.onclick=e=>{if(e.target.closest('.more,.menu'))return;openOrder(x.dataset.id)});document.querySelectorAll('.more').forEach(b=>b.onclick=e=>{e.stopPropagation();document.querySelectorAll('.menu').forEach(m=>m.classList.remove('open'));$(`[data-menu="${b.dataset.more}"]`).classList.add('open')});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async e=>{e.stopPropagation();await action(b.dataset.id,b.dataset.action);});}
async function load(){const{data:user,error:userError}=await client.auth.getUser();if(userError||!user){location.href='./';return}const{data,error}=await client.from('orders').select('*').order('is_pinned',{ascending:false}).order('created_at',{ascending:false});if(error){$('orders').innerHTML='<div class="empty">Unable to load orders.</div>';return}const bots={};const ids=[...new Set((data||[]).map(x=>x.bot_id))];if(ids.length){const{data:bs}=await client.from('bots').select('bot_id,bot_name').in('bot_id',ids);(bs||[]).forEach(b=>bots[b.bot_id]=b.bot_name)}rows=(data||[]).map(x=>({...x,bot_name:bots[x.bot_id]||x.bot_id}));render();}
async function action(id,a){if(a==='delete'&&!confirm('Delete this order permanently?'))return;if(a==='cancel'&&!confirm('Cancel this order?'))return;const{data,error}=a==='delete'?await client.rpc('delete_order',{p_order_id:id}):await client.rpc('order_set_state',{p_order_id:id,p_action:a==='pin'?(rows.find(x=>x.id===id)?.is_pinned?'unpin':'pin'):a==='read'?(rows.find(x=>x.id===id)?.is_read?'unread':'read'):'cancel'});if(error)return alert(error.message||'Action failed');const i=rows.findIndex(x=>x.id===id);if(a==='delete')rows.splice(i,1);else if(i>=0)rows[i]=data;render();}
async function openOrder(id){const o=rows.find(x=>x.id===id);if(!o)return;if(!o.is_read)await action(id,'read');$('dTitle').textContent=o.summary||'Order Details';$('dCode').textContent=o.order_code;const items=[['Bot',o.bot_name||o.bot_id],['Bot ID',o.bot_id],['Customer',o.customer_name||'Not provided'],['Phone',o.customer_phone||'Not provided'],['Date',fmt(o.created_at)],['Status',statusLabel(o.status)]];$('dGrid').innerHTML=items.map(x=>'<div class="info"><div class="label">'+esc(x[0])+'</div><div class="value">'+esc(x[1])+'</div></div>').join('');$('dImportant').textContent=JSON.stringify(o.important_details||{},null,2);$('dCustomer').textContent=JSON.stringify(o.customer_details||{},null,2);const{data:msgs}=await client.from('order_messages').select('*').eq('order_id',id).order('created_at',{ascending:true});$('dConversation').innerHTML=(msgs||[]).map(m=>'<div class="bubble '+(m.role==='user'?'user':'')+'"><div class="role">'+esc(m.role)+'</div>'+esc(m.content)+'</div>').join('')||'<div class="info">No conversation stored.</div>';const{data:ims}=await client.from('order_images').select('*').eq('order_id',id).order('created_at',{ascending:true});$('dImages').innerHTML='';for(const im of (ims||[])){const s=await client.storage.from('order-images').createSignedUrl(im.storage_path,3600);if(!s.error){const img=document.createElement('img');img.src=s.data.signedUrl;img.alt='Order image';$('dImages').appendChild(img)}}$('detail').classList.add('open');}
$('closeDetail').onclick=()=>$('detail').classList.remove('open');$('detail').onclick=e=>{if(e.target===$('detail'))$('detail').classList.remove('open')};$('search').oninput=render;document.addEventListener('click',e=>{if(!e.target.closest('.more,.menu'))document.querySelectorAll('.menu').forEach(m=>m.classList.remove('open'))});
logo();load();
</script></body></html>
