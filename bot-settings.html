<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bot Settings — Sadeeque AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:#102033;background:#f5faff}.page{min-height:100vh;padding:82px 18px 45px;background:radial-gradient(circle at 16% 8%,rgba(20,155,234,.13),transparent 30%),radial-gradient(circle at 88% 25%,rgba(91,105,255,.09),transparent 27%),linear-gradient(135deg,#fbfdff,#eef7ff 58%,#f8fcff)}.menu{position:fixed;z-index:120;top:18px;left:18px;width:44px;height:44px;border:1px solid #fff;border-radius:14px;background:#ffffffbd;backdrop-filter:blur(18px);cursor:pointer}.menu span{display:block;width:19px;height:2px;background:#203448;margin:4px auto;border-radius:3px}.overlay{position:fixed;inset:0;z-index:100;background:#19416429;opacity:0;visibility:hidden;transition:.2s}.overlay.open{opacity:1;visibility:visible}.side{position:fixed;z-index:110;top:0;left:0;width:285px;height:100vh;padding:22px 15px 16px;display:flex;flex-direction:column;transform:translateX(-105%);transition:.26s;background:#ffffffd1;border-right:1px solid #78aadc38;backdrop-filter:blur(28px)}.side.open{transform:translateX(0)}.brand{display:flex;align-items:center;gap:11px;padding:3px 9px 20px;border-bottom:1px solid #78aadc2e;margin-bottom:14px}.brand img{width:42px;height:42px;border-radius:13px;object-fit:cover}.brand strong{font-size:15px;letter-spacing:.08em}.close{margin-left:auto;border:0;border-radius:11px;width:34px;height:34px;font-size:24px;background:#ebf5fdbf;cursor:pointer}.nav{display:flex;flex-direction:column;gap:5px;overflow:auto}.nav a{min-height:43px;padding:11px 13px;border-radius:13px;text-decoration:none;color:#526477;font-size:14px;font-weight:650}.nav a:hover,.nav a.active{color:#087fe9;background:#1e9bf01a}.logout{margin-top:auto;border:0;border-top:1px solid #78aadc2e;background:#ffffff80;text-align:left;padding:15px 13px;color:#526477;font-weight:650;cursor:pointer}.main{max-width:980px;margin:auto}.back{display:inline-block;margin-bottom:10px;color:#5d7185;text-decoration:none;font-size:13px;font-weight:700}.header,.card{border:1px solid #fffffff0;background:#ffffffad;box-shadow:0 18px 45px #3682be1a,inset 0 1px 0 #fff;backdrop-filter:blur(24px);border-radius:20px}.header{padding:19px 20px;margin-bottom:14px}.header h1{margin:0;font-size:28px}.header p{margin:5px 0;color:#66798c;font-size:13px}.chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.chip{padding:9px 12px;border-radius:12px;background:#edf7ffbd;border:1px solid #8ab8dc36;font-size:12px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;border-radius:16px;background:#dbeaf79e;margin-bottom:14px}.tabs button,.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:750;cursor:pointer}.tabs button{background:transparent;color:#64778a}.tabs button.active{background:#ffffffe8;color:#087fe9}.list{display:grid;gap:9px}.setting{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:17px 18px;border:1px solid #fffffff0;background:#ffffffa8;box-shadow:0 17px 40px #3682be17,inset 0 1px 0 #fff;border-radius:18px;cursor:pointer;color:#102033}.setting strong{display:block;font-size:14px}.setting small{display:block;margin-top:3px;color:#75879a}.setting b{font-size:22px;color:#7990a4}.editor{margin-top:10px;padding:20px;border:1px solid #fffffff0;background:#ffffffa8;box-shadow:0 17px 40px #3682be17;border-radius:19px}.field{margin:0 0 14px}.field label{display:block;font-size:12px;font-weight:750;color:#4f6478;margin-bottom:7px}.input,.text{width:100%;border:1px solid #87abc94a;background:#ffffffb3;border-radius:13px;padding:12px 13px;font:600 13px inherit;color:#102033;outline:0}.text{min-height:145px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:flex;gap:9px;flex-wrap:wrap}.btn{background:#149bea;color:#fff;box-shadow:0 10px 22px #149bea2e}.btn.secondary{background:#ebf5fdd1;color:#4d6377;box-shadow:none}.status{display:flex;align-items:center;justify-content:space-between;padding:13px;border-radius:14px;background:#ffffff91;border:1px solid #87abc936;margin-bottom:14px}.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.theme{border:1px solid #87abc940;background:#ffffff94;border-radius:13px;padding:12px;text-align:left;cursor:pointer;font-weight:700;color:#4d6377}.theme.selected{border-color:#149bea94;box-shadow:0 0 0 3px #149bea14;color:#087fe9}.dot{display:block;height:34px;border-radius:9px;margin-bottom:7px}.playground-frame{display:block;width:100%;height:640px;border:0;border-radius:16px;background:#fff}.save-all{display:flex;justify-content:center;margin-top:14px}.save-all .btn{padding:9px 18px;font-size:12px}.danger{margin-top:14px;padding:20px;border:1px solid #d94d5938;background:#ffffffa8;border-radius:19px}.danger h2{margin:0 0 5px;color:#b43c49;font-size:18px}.danger p{font-size:12px;color:#738496}.info{display:grid;gap:10px}.info div{padding:16px 18px;border:1px solid #fffffff0;background:#ffffffa8;border-radius:17px}.info label{display:block;font-size:11px;color:#77899b;font-weight:750;margin-bottom:5px}.info strong{font-size:13px;word-break:break-word}.iframe-box{margin-top:2px}.iframe-box strong{display:block;word-break:break-word}.copy-btn{display:block;width:38px;height:38px;margin-top:10px;border:1px solid #8ab8dc45;border-radius:11px;background:#edf7ffbd;color:#416075;font-size:17px;cursor:pointer}.loading,.error{text-align:center;padding:45px;color:#687d91}.error{border-radius:18px;background:#fff9fa;border:1px solid #d94d5940;color:#a53b48}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:200;padding:11px 16px;border-radius:13px;background:#193145eb;color:#fff;font-size:13px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:650px){.page{padding:78px 13px 32px}.grid2,.themes{grid-template-columns:1fr}.header h1{font-size:24px}.playground-frame{height:620px}}</style></head><body><div class="page"><button class="menu" id="menu"><span></span><span></span><span></span></button><div class="overlay" id="overlay"></div><aside class="side" id="side"><div class="brand"><img id="logo" alt="Sadeeque AI logo"><strong>SADEEQUE AI</strong><button class="close" id="close">×</button></div><nav class="nav"><a href="./dashboard.html">Sadeeque AI Homepage</a><a class="active" href="./all-bots.html">All Bots</a><a href="./create-bot.html">Create Bot</a><a href="#">Instructions</a><a href="#">Knowledge</a><a href="#">External Support Knowledge</a><a href="#">API Keys</a><a href="#">Settings</a><a href="#">Health</a><a href="#">Webs Join</a></nav><button class="logout" id="logout">Log out</button></aside><main class="main"><a class="back" href="./all-bots.html">← All Bots</a><div id="loading" class="loading">Loading bot settings…</div><div id="err" class="error hidden"></div><div id="app" class="hidden"><header class="header"><h1 id="title">Bot Settings</h1><p>Settings for the selected bot.</p><div class="chips"><div class="chip">Bot Name: <b id="nameHead">—</b></div><div class="chip">Bot ID: <b id="idHead">—</b></div></div></header><div class="tabs"><button id="editTab" class="active">Editable</button><button id="fixedTab">Uneditable</button></div><section id="editable"><div class="list"><button class="setting" data-open="identity"><span><strong>Bot Identity</strong><small>Name, status, Chat Limit and Chat Limit Per User</small></span><b>›</b></button><button class="setting" data-open="rules"><span><strong>Bot Rules</strong><small>Rules that guide this bot</small></span><b>›</b></button><button class="setting" data-open="instructions"><span><strong>Instructions</strong><small>Bot-specific instructions</small></span><b>›</b></button><button class="setting" data-open="welcome"><span><strong>Welcome Message</strong><small>First message visitors see</small></span><b>›</b></button><button class="setting" data-open="background"><span><strong>Background</strong><small>Choose the bot UI theme</small></span><b>›</b></button><button class="setting" data-open="playground"><span><strong>Playground</strong><small>Open this exact bot without leaving the admin page</small></span><b>›</b></button></div><div id="editor"></div><div class="save-all"><button id="saveAll" class="btn">Save All Changes</button></div><div class="danger"><h2>Danger Zone</h2><p>Delete this bot permanently.</p><button id="delete" class="btn">Delete Bot</button></div></section><section id="fixed" class="hidden"><div class="info"><div><label>Bot ID</label><strong id="fixedId">—</strong></div><div><label>Status</label><strong id="fixedStatus">—</strong></div><div><label>Created</label><strong id="fixedCreated">—</strong></div><div><label>Iframe Code</label><div class="iframe-box"><strong id="fixedIframe">—</strong><button id="copyIframe" class="copy-btn" type="button" aria-label="Copy iframe code" title="Copy iframe code">⧉</button></div></div></div></section></div></main><div id="toast" class="toast"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://elvvupvcfdstkqpdtxxr.supabase.co','sb_publishable_V_tJaxkTECrDUig_kFT7zw_VWPd8L4C');const id=new URLSearchParams(location.search).get('bot_id'),q=s=>document.getElementById(s);let bot;const toast=t=>{q('toast').textContent=t;q('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>q('toast').classList.remove('show'),2200)};async function loadLogo(){try{const t=await(await fetch('./index.html',{cache:'no-store'})).text(),m=t.match(/data:image\/jpeg;base64,([^\"]+)/);if(m)q('logo').src='data:image/jpeg;base64,'+m[1]}catch(e){}}loadLogo();const side=q('side'),overlay=q('overlay');function closeSide(){side.classList.remove('open');overlay.classList.remove('open')}q('menu').onclick=()=>{side.classList.toggle('open');overlay.classList.toggle('open')};q('close').onclick=closeSide;overlay.onclick=closeSide;document.addEventListener('pointerdown',e=>{if(side.classList.contains('open')&&!side.contains(e.target)&&e.target!==q('menu'))closeSide()});q('logout').onclick=async()=>{await db.auth.signOut();location.href='./'};function escape(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function refresh(){q('nameHead').textContent=bot.bot_name;q('idHead').textContent=bot.bot_id;q('title').textContent='Bot Settings — '+bot.bot_name;q('fixedId').textContent=bot.bot_id;q('fixedStatus').textContent=bot.status==='active'?'Active':'Inactive';q('fixedCreated').textContent=new Date(bot.created_at).toLocaleString();q('fixedIframe').textContent=bot.iframe_code||'—'}async function save(fields,msg){const{data,error}=await db.rpc('update_bot_settings',{p_bot_id:bot.bot_id,...fields});if(error||!data?.length){toast(error?.message||'Could not save changes');return false}bot=data[0];refresh();toast(msg);return true}function clearEditor(){q('editor').innerHTML=''}function currentEditorFields(){const f={};if(q('bn'))f.p_bot_name=q('bn').value;if(q('cl'))f.p_chat_limit=Number(q('cl').value);if(q('cpu'))f.p_chat_limit_per_user=Number(q('cpu').value);if(q('txt')){const open=q('editor').querySelector('h2')?.textContent;f[open==='Bot Rules'?'p_bot_rules':open==='Instructions'?'p_custom_instructions':'p_welcome_message']=q('txt').value}return f}async function saveAll(){const f={p_bot_name:bot.bot_name,p_bot_rules:bot.bot_rules,p_custom_instructions:bot.custom_instructions,p_welcome_message:bot.welcome_message,p_background_theme:bot.background_theme,p_chat_limit:bot.chat_limit,p_chat_limit_per_user:bot.chat_limit_per_user,...currentEditorFields()};if((f.p_chat_limit!==null&&!Number.isInteger(f.p_chat_limit))||f.p_chat_limit<1||(f.p_chat_limit_per_user!==null&&!Number.isInteger(f.p_chat_limit_per_user))||f.p_chat_limit_per_user<1){toast('Chat limits must be positive whole numbers');return}await save(f,'All bot settings saved')}function identity(){q('editor').innerHTML=`<div class="editor"><h2>Bot Identity & Limits</h2><div class="field"><label>Bot Name</label><input id="bn" class="input" maxlength="120" value="${escape(bot.bot_name)}"></div><div class="grid2"><div class="field"><label>Chat Limit</label><input id="cl" class="input" type="number" min="1" value="${bot.chat_limit||1000}"></div><div class="field"><label>Chat Limit Per User</label><input id="cpu" class="input" type="number" min="1" value="${bot.chat_limit_per_user||50}"></div></div><div class="status"><span>Bot Status: <b>${bot.status==='active'?'Active':'Inactive'}</b></span><button id="toggle" class="btn secondary">${bot.status==='active'?'Disable':'Enable'}</button></div><div class="row"><button id="saveIdentity" class="btn">Save Changes</button><button id="closeEditor" class="btn secondary">Close</button></div></div>`;q('toggle').onclick=async()=>{const{data,error}=await db.rpc('set_bot_status',{p_bot_id:bot.bot_id,p_enabled:bot.status!=='active'});if(error||!data){toast(error?.message||'Could not update status');return}bot.status=data[0]?.status||data.status;identity();refresh()};q('saveIdentity').onclick=async()=>{const a=Number(q('cl').value),b=Number(q('cpu').value);if(!Number.isInteger(a)||a<1||!Number.isInteger(b)||b<1){toast('Chat limits must be positive whole numbers');return}await save({p_bot_name:q('bn').value,p_chat_limit:a,p_chat_limit_per_user:b},'Bot identity and limits saved')};q('closeEditor').onclick=clearEditor}function textEditor(kind){const c={rules:['Bot Rules','bot_rules','p_bot_rules','Save Rules'],instructions:['Instructions','custom_instructions','p_custom_instructions','Save Instructions'],welcome:['Welcome Message','welcome_message','p_welcome_message','Save Welcome Message']}[kind];q('editor').innerHTML=`<div class="editor"><h2>${c[0]}</h2><div class="field"><textarea id="txt" class="text">${escape(bot[c[1]])}</textarea></div><div class="row"><button id="saveText" class="btn">${c[3]}</button><button id="closeEditor" class="btn secondary">Close</button></div></div>`;q('saveText').onclick=async()=>{const f={};f[c[2]]=q('txt').value;await save(f,c[3]+' saved')};q('closeEditor').onclick=clearEditor}const themes=[['default','Default','linear-gradient(135deg,#f7fbff,#dff1ff)'],['white_blue','White / Blue','linear-gradient(135deg,#fff,#bfe8ff)'],['pink_purple','Pink / Purple','linear-gradient(135deg,#ffd8ec,#bda8ff)'],['black_blue','Black / Blue','linear-gradient(135deg,#101622,#1466b8)'],['green_blue','Green / Blue','linear-gradient(135deg,#d7ffe9,#8dd9ff)'],['orange_pink','Orange / Pink','linear-gradient(135deg,#ffd39a,#ff9bc5)'],['dark','Dark','linear-gradient(135deg,#0e1520,#33445b)']];function theme(t){return themes.find(x=>x[0]===t)?.[2]||themes[0][2]}function background(){q('editor').innerHTML=`<div class="editor"><h2>Background</h2><p>Select a theme. The UI preview changes immediately and is saved to this bot.</p><div class="themes">${themes.map(x=>`<button class="theme ${bot.background_theme===x[0]?'selected':''}" data-t="${x[0]}"><span class="dot" style="background:${x[2]}"></span>${x[1]}</button>`).join('')}</div><div class="chat" id="preview" style="background:${theme(bot.background_theme)}"><div class="chathead">${escape(bot.bot_name)}</div><div class="chatbody"><div class="bubble">${escape(bot.welcome_message||'Welcome!')}</div></div><div class="chatfoot">Your message…</div></div><button id="closeEditor" class="btn secondary">Close</button></div>`;document.querySelectorAll('.theme').forEach(x=>x.onclick=async()=>{const old=bot.background_theme,now=x.dataset.t;document.querySelectorAll('.theme').forEach(y=>y.classList.toggle('selected',y===x));q('preview').style.background=theme(now);const ok=await save({p_background_theme:now},'Background updated');if(!ok){document.querySelectorAll('.theme').forEach(y=>y.classList.toggle('selected',y.dataset.t===old));q('preview').style.background=theme(old)}});q('closeEditor').onclick=clearEditor}function playground(){q('editor').innerHTML=`<div class="editor"><h2>Playground</h2><p>This opens the exact selected bot in place, using its real current UI, theme, status, welcome message and chat behavior.</p><iframe class="playground-frame" title="Sadeeque AI Playground" src="./embed.html?bot_id=${encodeURIComponent(bot.bot_id)}" loading="eager" allow="clipboard-write"></iframe><div class="row" style="margin-top:10px"><button id="closeEditor" class="btn secondary">Close</button></div></div>`;q('closeEditor').onclick=clearEditor}document.querySelectorAll('.setting').forEach(x=>x.onclick=()=>({identity,rules:()=>textEditor('rules'),instructions:()=>textEditor('instructions'),welcome:()=>textEditor('welcome'),background,playground}[x.dataset.open]||identity)());q('editTab').onclick=()=>{q('editable').classList.remove('hidden');q('fixed').classList.add('hidden');q('editTab').classList.add('active');q('fixedTab').classList.remove('active');clearEditor()};q('fixedTab').onclick=()=>{q('editable').classList.add('hidden');q('fixed').classList.remove('hidden');q('editTab').classList.remove('active');q('fixedTab').classList.add('active');clearEditor()};q('copyIframe').onclick=async()=>{const code=bot?.iframe_code||'';if(!code){toast('Iframe code is not available');return}try{await navigator.clipboard.writeText(code);toast('Iframe code copied')}catch(e){const ta=document.createElement('textarea');ta.value=code;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Iframe code copied')}};q('saveAll').onclick=saveAll;q('delete').onclick=async()=>{if(!confirm('Delete this bot permanently?'))return;const{data,error}=await db.rpc('delete_bot',{p_bot_id:bot.bot_id});if(error||!data){toast(error?.message||'Could not delete bot');return}location.href='./all-bots.html'};async function init(){if(!id){location.replace('./all-bots.html');return}try{const{data:s,error:se}=await db.auth.getSession();if(se||!s.session){location.replace('./');return}const{data:p,error:pe}=await db.from('admin_profiles').select('is_admin').eq('id',s.session.user.id).maybeSingle();if(pe||!p?.is_admin){await db.auth.signOut();location.replace('./');return}const timeout=new Promise(r=>setTimeout(()=>r({data:null,error:{message:'Loading timed out. Please try again.'}}),10000));const r=await Promise.race([db.rpc('get_bot_settings',{p_bot_id:id}),timeout]);if(r.error||!r.data?.length)throw Error(r.error?.message||'Bot not found');bot=r.data[0];refresh();q('loading').classList.add('hidden');q('app').classList.remove('hidden')}catch(e){q('loading').classList.add('hidden');q('err').textContent=e.message;q('err').classList.remove('hidden')}}init();</script></body></html>
