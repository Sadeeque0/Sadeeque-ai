<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bot Settings — Sadeeque AI</title><link rel="stylesheet" href="./styles.css"><style>:root{--text:#102033;--muted:#66798c}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--text);background:#f5faff}.page{min-height:100vh;padding:82px 18px 45px;background:radial-gradient(circle at 16% 8%,rgba(20,155,234,.13),transparent 30%),radial-gradient(circle at 88% 25%,rgba(91,105,255,.09),transparent 27%),linear-gradient(135deg,#fbfdff,#eef7ff 58%,#f8fcff)}.menu-button{position:fixed;z-index:120;top:18px;left:18px;width:44px;height:44px;border:1px solid #fff;border-radius:14px;background:#ffffffbd;backdrop-filter:blur(18px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}.menu-button span{width:19px;height:2px;border-radius:4px;background:#203448}.overlay{position:fixed;inset:0;z-index:100;background:#19416429;opacity:0;visibility:hidden;pointer-events:none;transition:.2s}.overlay.open{opacity:1;visibility:visible;pointer-events:auto}.sidebar{position:fixed;z-index:110;top:0;left:0;width:285px;height:100vh;padding:22px 15px 16px;display:flex;flex-direction:column;transform:translateX(-105%);transition:.26s;background:#ffffffd1;border-right:1px solid #78aadc38;backdrop-filter:blur(28px);box-shadow:18px 0 45px #2878be24}.sidebar.open{transform:translateX(0)}.sidebar-brand{display:flex;align-items:center;gap:11px;padding:3px 9px 20px;border-bottom:1px solid #78aadc2e;margin-bottom:14px}.sidebar-brand img{width:42px;height:42px;border-radius:13px;object-fit:cover}.sidebar-brand strong{font-size:15px;letter-spacing:.08em}.close-sidebar{margin-left:auto;width:34px;height:34px;border:0;border-radius:11px;background:#ebf5fdbf;color:#526477;font-size:24px;cursor:pointer}.nav{display:flex;flex-direction:column;gap:5px;overflow:auto}.nav a{display:flex;align-items:center;min-height:43px;text-decoration:none;color:#526477;padding:11px 13px;border-radius:13px;font-size:14px;font-weight:650}.nav a:hover,.nav a.active{color:#087fe9;background:#1e9bf01a}.logout-wrap{margin-top:auto;padding-top:14px;border-top:1px solid #78aadc2e}.logout{width:100%;border:0;background:#ffffff80;color:#526477;text-align:left;padding:12px 13px;border-radius:13px;font:600 14px inherit;cursor:pointer}.main{max-width:980px;margin:0 auto}.back{display:inline-flex;margin-bottom:10px;color:#5d7185;text-decoration:none;font-size:13px;font-weight:700}.header{padding:19px 20px;margin-bottom:14px;border:1px solid #fffffff0;border-radius:21px;background:#ffffffad;box-shadow:0 18px 45px #3682be1a,inset 0 1px 0 #fff;backdrop-filter:blur(24px)}.header h1{margin:0;font-size:28px;letter-spacing:-.03em}.header p{margin:5px 0 0;color:var(--muted);font-size:13px}.identity{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}.chip{padding:9px 12px;border-radius:12px;background:#edf7ffbd;border:1px solid #8ab8dc36;font-size:12px}.chip b{font-weight:800}.switcher{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;border-radius:16px;background:#dbeaf79e;border:1px solid #ffffffe6;margin-bottom:14px}.switcher button{border:0;background:transparent;border-radius:12px;padding:11px;font:750 13px inherit;color:#64778a;cursor:pointer}.switcher button.active{background:#ffffffe8;color:#087fe9;box-shadow:0 8px 22px #307eb81c}.panel{display:none}.panel.active{display:block}.settings-list{display:grid;gap:9px}.setting-card{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:17px 18px;border:1px solid #fffffff0;background:#ffffffa8;box-shadow:0 17px 40px #3682be17,inset 0 1px 0 #fff;backdrop-filter:blur(22px);border-radius:18px;cursor:pointer;color:var(--text)}.setting-card strong{display:block;font-size:14px}.setting-card span{display:block;margin-top:3px;font-size:12px;color:#75879a}.setting-card b{font-size:22px;color:#7990a4}.editor{margin-top:10px;padding:20px;border:1px solid #fffffff0;background:#ffffffa8;box-shadow:0 17px 40px #3682be17,inset 0 1px 0 #fff;backdrop-filter:blur(22px);border-radius:19px}.editor h2{margin:0 0 5px;font-size:18px}.sub{margin:0 0 16px;color:var(--muted);font-size:12px}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:750;color:#4f6478;margin-bottom:7px}.input,.textarea{width:100%;border:1px solid #87abc94a;background:#ffffffb3;border-radius:13px;padding:12px 13px;color:var(--text);font:600 13px inherit;outline:none}.textarea{min-height:145px;resize:vertical;line-height:1.55}.input:focus,.textarea:focus{border-color:#149bea7a;box-shadow:0 0 0 4px #149bea14}.limit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:12px;padding:11px 15px;background:#149bea;color:#fff;font:750 13px inherit;cursor:pointer;box-shadow:0 10px 22px #149bea2e}.btn.secondary{background:#ebf5fdd1;color:#4d6377;box-shadow:none}.btn.danger{background:#d94d59}.row{display:flex;gap:9px;flex-wrap:wrap}.status-row{display:flex;align-items:center;justify-content:space-between;padding:13px;border-radius:14px;background:#ffffff91;border:1px solid #87abc936}.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.theme-option{border:1px solid #87abc940;background:#ffffff94;border-radius:13px;padding:12px;text-align:left;cursor:pointer;font:700 12px inherit;color:#4d6377}.theme-option.selected{border-color:#149bea94;box-shadow:0 0 0 3px #149bea14;color:#087fe9}.theme-dot{display:block;width:100%;height:30px;border-radius:9px;margin-bottom:7px;background:linear-gradient(135deg,#f7fbff,#dff1ff)}.chat{max-width:560px;margin:14px auto 0;border-radius:20px;overflow:hidden;border:1px solid #ffffffdb;box-shadow:0 18px 40px #1e5a8721}.chat-head{padding:15px 16px;font-weight:800;font-size:14px;background:#ffffffe0;border-bottom:1px solid #78aadc29}.chat-body{min-height:240px;padding:18px;background:linear-gradient(135deg,#f7fbff,#dff1ff)}.bubble{max-width:82%;padding:12px 14px;border-radius:15px 15px 15px 5px;font-size:13px;line-height:1.5;background:#ffffffe8;box-shadow:0 7px 20px #1e5a8714}.chat-foot{padding:11px;background:#ffffffd9;border-top:1px solid #78aadc29;color:#8293a3;font-size:12px}.uneditable-grid{display:grid;gap:10px}.info-card{padding:16px 18px;border:1px solid #fffffff0;background:#ffffffa8;box-shadow:0 17px 40px #3682be14;border-radius:17px}.info-card label{display:block;font-size:11px;color:#77899b;font-weight:750;margin-bottom:5px}.info-card div{font-size:13px;font-weight:750;word-break:break-word}.danger-zone{margin-top:14px;padding:20px;border:1px solid #d94d5938;background:#ffffffa8;border-radius:19px}.danger-zone h2{margin:0 0 5px;color:#b43c49;font-size:18px}.danger-zone p{font-size:12px;color:#738496}.loading,.error{text-align:center;padding:45px;color:#687d91}.error{border-radius:18px;background:#fff9fa;border:1px solid #d94d5940;color:#a53b48}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:200;padding:11px 16px;border-radius:13px;background:#193145eb;color:#fff;font-size:13px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:650px){.page{padding:78px 13px 32px}.header h1{font-size:24px}.limit-grid,.theme-grid{grid-template-columns:1fr}}</style></head><body><div class="page"><button class="menu-button" id="menuButton" aria-label="Open sidebar"><span></span><span></span><span></span></button><div class="overlay" id="overlay"></div><aside class="sidebar" id="sidebar"><div class="sidebar-brand"><img id="sidebarLogo" src="" alt="Sadeeque AI logo"><strong>SADEEQUE AI</strong><button class="close-sidebar" id="closeSidebar">×</button></div><nav class="nav"><a href="./dashboard.html">Sadeeque AI Homepage</a><a class="active" href="./all-bots.html">All Bots</a><a href="./create-bot.html">Create Bot</a><a href="#">Instructions</a><a href="#">Knowledge</a><a href="#">External Support Knowledge</a><a href="#">API Keys</a><a href="#">Settings</a><a href="#">Health</a><a href="#">Webs Join</a></nav><div class="logout-wrap"><button class="logout" id="logoutButton">Log out</button></div></aside><main class="main"><a class="back" href="./all-bots.html">← All Bots</a><div id="loading" class="loading">Loading bot settings…</div><div id="error" class="error hidden"></div><div id="content" class="hidden"><header class="header"><h1 id="title">Bot Settings</h1><p>Settings for the selected bot.</p><div class="identity"><div class="chip">Bot Name: <b id="headName">—</b></div><div class="chip">Bot ID: <b id="headId">—</b></div></div></header><div class="switcher"><button id="editableTab" class="active">Editable</button><button id="uneditableTab">Uneditable</button></div><section id="editablePanel" class="panel active"><div class="settings-list"><button class="setting-card" data-section="identity"><div><strong>Bot Identity</strong><span>Name, status, Chat Limit and Chat Limit Per User</span></div><b>›</b></button><button class="setting-card" data-section="rules"><div><strong>Bot Rules</strong><span>Rules that guide this bot</span></div><b>›</b></button><button class="setting-card" data-section="instructions"><div><strong>Instructions</strong><span>Custom instructions for this bot</span></div><b>›</b></button><button class="setting-card" data-section="welcome"><div><strong>Welcome Message</strong><span>First message visitors see</span></div><b>›</b></button><button class="setting-card" data-section="background"><div><strong>Background</strong><span>Choose the bot UI theme</span></div><b>›</b></button><button class="setting-card" data-section="playground"><div><strong>Playground</strong><span>Preview the same bot chat UI</span></div><b>›</b></button></div><div id="editorArea"></div><div class="danger-zone"><h2>Danger Zone</h2><p>Delete this bot permanently.</p><button id="deleteButton" class="btn danger">Delete Bot</button></div></section><section id="uneditablePanel" class="panel"><div class="uneditable-grid"><div class="info-card"><label>Bot ID</label><div id="uBotId">—</div></div><div class="info-card"><label>Status</label><div id="uStatus">—</div></div><div class="info-card"><label>Created</label><div id="uCreated">—</div></div><div class="info-card"><label>Iframe Code</label><div id="uIframe">—</div></div></div></section></div></main><div id="toast" class="toast"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=supabase.createClient('https://elvvupvcfdstkqpdtxxr.supabase.co','sb_publishable_V_tJaxkTECrDUig_kFT7zw_VWPd8L4C');const botId=new URLSearchParams(location.search).get('bot_id'),$=id=>document.getElementById(id),toast=$('toast');let bot=null;function notify(t){toast.textContent=t;toast.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>toast.classList.remove('show'),2200)}async function logo(){try{const h=await(await fetch('./index.html',{cache:'no-store'})).text(),m=h.match(/data:image\/jpeg;base64,([^\"]+)/);if(m)$('sidebarLogo').src='data:image/jpeg;base64,'+m[1]}catch(e){}}logo();const sidebar=$('sidebar'),overlay=$('overlay');function closeDrawer(){sidebar.classList.remove('open');overlay.classList.remove('open')}$('menuButton').onclick=()=>{sidebar.classList.toggle('open');overlay.classList.toggle('open')};$('closeSidebar').onclick=closeDrawer;overlay.onclick=closeDrawer;document.addEventListener('pointerdown',e=>{if(sidebar.classList.contains('open')&&!sidebar.contains(e.target)&&e.target!==$('menuButton'))closeDrawer()});$('logoutButton').onclick=async()=>{const {error}=await client.auth.signOut();if(!error)location.href='./'};function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}function refresh(){ $('headName').textContent=bot.bot_name;$('headId').textContent=bot.bot_id;$('title').textContent='Bot Settings — '+bot.bot_name;$('uBotId').textContent=bot.bot_id;$('uStatus').textContent=bot.status==='active'?'Active':'Inactive';$('uCreated').textContent=new Date(bot.created_at).toLocaleString();$('uIframe').textContent=bot.iframe_code||'—'}function themeStyle(t){return ({default:'linear-gradient(135deg,#f7fbff,#dff1ff)',white_blue:'linear-gradient(135deg,#fff,#bfe8ff)',pink_purple:'linear-gradient(135deg,#ffd8ec,#bda8ff)',black_blue:'linear-gradient(135deg,#101622,#1466b8)',green_blue:'linear-gradient(135deg,#d7ffe9,#8dd9ff)',orange_pink:'linear-gradient(135deg,#ffd39a,#ff9bc5)',dark:'linear-gradient(135deg,#0e1520,#33445b)'})[t]||'linear-gradient(135deg,#f7fbff,#dff1ff)'}async function save(fields,msg){const {data,error}=await client.rpc('update_bot_settings',{p_bot_id:bot.bot_id,...fields});if(error||!data){notify(error?.message||'Could not save changes');return false}bot={...bot,...(data[0]||data)};refresh();notify(msg||'Saved');return true}function closeEditor(){ $('editorArea').innerHTML=''}function openIdentity(){editorArea.innerHTML=`<div class="editor"><h2>Bot Identity & Limits</h2><p class="sub">These values apply only to ${esc(bot.bot_name)}.</p><div class="field"><label>Bot Name</label><input id="name" class="input" maxlength="120" value="${esc(bot.bot_name)}"></div><div class="limit-grid"><div class="field"><label>Chat Limit</label><input id="limit" class="input" type="number" min="1" value="${bot.chat_limit||1000}"></div><div class="field"><label>Chat Limit Per User</label><input id="userLimit" class="input" type="number" min="1" value="${bot.chat_limit_per_user||50}"></div></div><div class="status-row"><span>Bot Status: <b id="statusText">${bot.status==='active'?'Active':'Inactive'}</b></span><button id="status" class="btn secondary">${bot.status==='active'?'Disable':'Enable'}</button></div><div class="row" style="margin-top:14px"><button id="save" class="btn">Save Changes</button><button id="close" class="btn secondary">Close</button></div></div>`;$('status').onclick=async()=>{const enable=bot.status!=='active';const {data,error}=await client.rpc('set_bot_status',{p_bot_id:bot.bot_id,p_enabled:enable});if(error||!data){notify(error?.message||'Could not update status');return}bot.status=data[0]?.status||data.status;$('statusText').textContent=bot.status==='active'?'Active':'Inactive';$('status').textContent=bot.status==='active'?'Disable':'Enable';refresh()};$('save').onclick=async()=>{const limit=Number($('limit').value),userLimit=Number($('userLimit').value);if(!Number.isInteger(limit)||limit<1||!Number.isInteger(userLimit)||userLimit<1){notify('Chat limits must be positive whole numbers');return}await save({p_bot_name:$('name').value,p_chat_limit:limit,p_chat_limit_per_user:userLimit},'Bot identity and limits saved')};$('close').onclick=closeEditor}function openText(type){const cfg={rules:['Bot Rules','Rules used by this bot.','rules','bot_rules','Save Rules'],instructions:['Instructions','Bot-specific instructions replace Global Instructions entirely when present.','instructions','custom_instructions','Save Instructions'],welcome:['Welcome Message','The first message shown in the bot chat.','welcome','welcome_message','Save Welcome Message']}[type];editorArea.innerHTML=`<div class="editor"><h2>${cfg[0]}</h2><p class="sub">${cfg[1]}</p><div class="field"><textarea id="text" class="textarea">${esc(bot[cfg[3]])}</textarea></div><div class="row"><button id="saveText" class="btn">${cfg[4]}</button><button id="close" class="btn secondary">Close</button></div></div>`;$('saveText').onclick=async()=>{const field={};field['p_'+cfg[2]]= $('text').value;await save(field,cfg[4]+' saved')};$('close').onclick=closeEditor}function openBackground(){const themes=[['default','Default'],['white_blue','White / Blue'],['pink_purple','Pink / Purple'],['black_blue','Black / Blue'],['green_blue','Green / Blue'],['orange_pink','Orange / Pink'],['dark','Dark']];editorArea.innerHTML=`<div class="editor"><h2>Background</h2><p class="sub">Select a theme. The preview changes immediately and the selected theme is saved to this bot.</p><div class="theme-grid">${themes.map(x=>`<button class="theme-option ${bot.background_theme===x[0]?'selected':''}" data-theme="${x[0]}"><span class="theme-dot" style="background:${themeStyle(x[0])}"></span>${x[1]}</button>`).join('')}</div><div class="preview" style="margin-top:14px"><div class="chat" id="themeChat" style="background:${themeStyle(bot.background_theme)}"><div class="chat-head">${esc(bot.bot_name)}</div><div class="chat-body"><div class="bubble">${esc(bot.welcome_message)}</div></div><div class="chat-foot">Your message…</div></div></div><div class="row" style="margin-top:14px"><button id="close" class="btn secondary">Close</button></div></div>`;document.querySelectorAll('.theme-option').forEach(b=>b.onclick=async()=>{const old=bot.background_theme;bot.background_theme=b.dataset.theme;document.querySelectorAll('.theme-option').forEach(x=>x.classList.toggle('selected',x===b));$('themeChat').style.background=themeStyle(bot.background_theme);const ok=await save({p_background_theme:bot.background_theme},'Background updated');if(!ok){bot.background_theme=old;$('themeChat').style.background=themeStyle(old)}});$('close').onclick=closeEditor}function openPlayground(){editorArea.innerHTML=`<div class="editor"><h2>Playground</h2><p class="sub">This is the bot's shared chat UI preview. The same UI/theme/configuration is used by the external embed.</p><div class="chat" id="playChat" style="background:${themeStyle(bot.background_theme)}"><div class="chat-head">${esc(bot.bot_name)}</div><div class="chat-body"><div class="bubble" id="playWelcome">${esc(bot.welcome_message)}</div></div><div class="chat-foot">Your message…</div></div><div class="row" style="margin-top:14px"><button id="close" class="btn secondary">Close</button></div></div>`;$('close').onclick=closeEditor}document.querySelectorAll('.setting-card').forEach(b=>b.onclick=()=>{const f={identity:openIdentity,rules:()=>openText('rules'),instructions:()=>openText('instructions'),welcome:()=>openText('welcome'),background:openBackground,playground:openPlayground}[b.dataset.section];if(f)f()});function switchTab(edit){$('editableTab').classList.toggle('active',edit);$('uneditableTab').classList.toggle('active',!edit);$('editablePanel').classList.toggle('active',edit);$('uneditablePanel').classList.toggle('active',!edit);closeEditor()}$('editableTab').onclick=()=>switchTab(true);$('uneditableTab').onclick=()=>switchTab(false);$('deleteButton').onclick=async()=>{if(!confirm(`Delete bot "${bot?.bot_name||''}"? This action cannot be undone.`))return;const {data,error}=await client.rpc('delete_bot',{p_bot_id:bot.bot_id});if(error||!data){notify(error?.message||'Could not delete bot');return}location.href='./all-bots.html'};async function init(){if(!botId){location.replace('./all-bots.html');return}try{const {data:s,error:se}=await client.auth.getSession();if(se||!s.session){location.replace('./');return}const {data:p,error:pe}=await client.from('admin_profiles').select('is_admin').eq('id',s.session.user.id).maybeSingle();if(pe||!p?.is_admin){await client.auth.signOut();location.replace('./');return}const timeout=new Promise(r=>setTimeout(()=>r({data:null,error:{message:'Loading timed out. Please try again.'}}),10000));const result=await Promise.race([client.rpc('get_bot_settings',{p_bot_id:botId}),timeout]);if(result.error||!result.data?.length)throw new Error(result.error?.message||'Bot not found');bot=result.data[0];refresh();$('loading').classList.add('hidden');$('content').classList.remove('hidden')}catch(e){$('loading').classList.add('hidden');$('error').textContent=e.message||'Unable to load bot settings.';$('error').classList.remove('hidden')}}init();</script></body></html>
