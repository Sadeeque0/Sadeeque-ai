<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Bots — Sadeeque AI</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./all-bots.css"></head><body><div class="page"><button class="menu-button" id="menuButton" aria-label="Open sidebar"><span></span><span></span><span></span></button><div class="overlay" id="overlay"></div><aside class="sidebar" id="sidebar"><div class="sidebar-brand"><img id="sidebarLogo" src="" alt="Sadeeque AI logo"><strong>SADEEQUE AI</strong><button class="close-sidebar" id="closeSidebar">×</button></div><nav class="nav"><a href="./dashboard.html">Sadeeque AI Homepage</a><a class="active" href="./all-bots.html">All Bots</a><a href="./create-bot.html">Create Bot</a><a href="./instructions.html">Instructions</a><a href="./knowledge.html">Knowledge</a><a href="./external-support.html">External Support Knowledge</a><a href="./api-keys.html">API Keys</a><a href="#">Settings</a><a href="#">Health</a><a href="#">Webs Join</a></nav><div class="logout-wrap"><button class="logout" id="logoutButton">Log out</button></div></aside><main class="main"><div class="topbar"><h1>All Bots</h1><p>Manage all your AI bots from one place.</p></div><section id="botGrid" class="bot-grid"></section><div id="loading" class="loading">Loading bots…</div><div id="empty" class="empty hidden">No bots have been created yet.</div><div id="errorState" class="error-state hidden">Unable to load bots. Please try again.</div></main><div class="toast" id="toast"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=supabase.createClient('https://elvvupvcfdstkqpdtxxr.supabase.co','sb_publishable_V_tJaxkTECrDUig_kFT7zw_VWPd8L4C');const sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay'),menuButton=document.getElementById('menuButton'),closeSidebar=document.getElementById('closeSidebar'),logoutButton=document.getElementById('logoutButton'),sidebarLogo=document.getElementById('sidebarLogo');async function loadLogo(){try{const h=await(await fetch('./index.html',{cache:'no-store'})).text(),m=h.match(/data:image\/jpeg;base64,([^\"]+)/);if(m)sidebarLogo.src='data:image/jpeg;base64,'+m[1]}catch(e){}}loadLogo();function closeDrawer(){sidebar.classList.remove('open');overlay.classList.remove('open')}function openDrawer(){sidebar.classList.add('open');overlay.classList.add('open')}menuButton.onclick=()=>sidebar.classList.contains('open')?closeDrawer():openDrawer();closeSidebar.onclick=closeDrawer;overlay.onclick=closeDrawer;document.addEventListener('pointerdown',e=>{if(sidebar.classList.contains('open')&&!sidebar.contains(e.target)&&e.target!==menuButton)closeDrawer()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});logoutButton.onclick=async()=>{const{error}=await client.auth.signOut();if(!error)location.href='./'};const grid=document.getElementById('botGrid'),loading=document.getElementById('loading'),empty=document.getElementById('empty'),errorState=document.getElementById('errorState'),toast=document.getElementById('toast');function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1800)}function closeMenus(){document.querySelectorAll('.bot-menu').forEach(x=>x.remove())}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}function makeCard(bot){const card=document.createElement('article');card.className='bot-card';renderCard(card,bot);card.addEventListener('click',e=>{if(e.target.closest('.dots')||e.target.closest('.bot-menu'))return;location.href='./bot-settings.html?bot_id='+encodeURIComponent(bot.bot_id)});return card}function renderCard(card,bot){const active=String(bot.status).toLowerCase()==='active';card.innerHTML=`<div class="bot-head"><div class="bot-name">${esc(bot.bot_name)}</div><button class="dots" type="button" aria-label="Bot actions">⋮</button></div><div class="bot-id">${esc(bot.bot_id)}</div><div class="bot-status ${active?'active':'inactive'}"><span class="status-dot"></span>${active?'Active':'Inactive'}</div>`;card.querySelector('.dots').onclick=e=>{e.stopPropagation();closeMenus();const menu=document.createElement('div');menu.className='bot-menu';const action=document.createElement('button');action.textContent=active?'Disable':'Enable';action.onclick=async()=>{closeMenus();const{data,error}=await client.rpc('set_bot_status',{p_bot_id:bot.bot_id,p_enabled:!active});if(error||!data){showToast('Could not update bot status');return}bot.status=data[0]?.status||data.status;renderCard(card,bot);showToast(bot.status==='active'?'Bot enabled':'Bot disabled')};menu.appendChild(action);const pin=document.createElement('button');pin.textContent=bot.is_pinned?'Unpin':'Pin';pin.onclick=async()=>{closeMenus();const{data,error}=await client.rpc('set_bot_pinned',{p_bot_id:bot.bot_id,p_pinned:!bot.is_pinned});if(error||!data){showToast('Could not update pin');return}bot.is_pinned=data[0]?.is_pinned??data.is_pinned;await loadBots();showToast(bot.is_pinned?'Bot pinned':'Bot unpinned')};menu.appendChild(pin);const cancel=document.createElement('button');cancel.textContent='Cancel';cancel.onclick=closeMenus;menu.appendChild(cancel);card.appendChild(menu)}}async function loadBots(){loading.classList.remove('hidden');empty.classList.add('hidden');errorState.classList.add('hidden');const{data:s,error:se}=await client.auth.getSession();if(se||!s.session){location.replace('./');return}const{data:p,error:pe}=await client.from('admin_profiles').select('is_admin').eq('id',s.session.user.id).maybeSingle();if(pe||!p?.is_admin){await client.auth.signOut();location.replace('./');return}const{data,error}=await client.rpc('list_bots');loading.classList.add('hidden');if(error){errorState.classList.remove('hidden');return}if(!data?.length){empty.classList.remove('hidden');return}grid.innerHTML='';data.forEach(b=>grid.appendChild(makeCard(b)))}loadBots();</script></body></html>
