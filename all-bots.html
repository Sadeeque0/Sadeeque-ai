<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>All Bots — Sadeeque AI</title>
<link rel="stylesheet" href="./styles.css">
<style>
:root{--blue:#149bea;--text:#102033;--muted:#66798c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5faff;color:var(--text)}body{overflow-x:hidden}.page-bg{min-height:100vh;background:radial-gradient(circle at 18% 12%,rgba(20,155,234,.11),transparent 29%),radial-gradient(circle at 86% 28%,rgba(20,155,234,.08),transparent 28%),linear-gradient(135deg,#fbfdff 0%,#eef7ff 56%,#f8fcff 100%)}
.menu-button{position:fixed;z-index:120;top:18px;left:18px;width:44px;height:44px;border:1px solid rgba(255,255,255,.95);border-radius:14px;background:rgba(255,255,255,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 28px rgba(45,125,190,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0}.menu-button span{width:19px;height:2px;border-radius:4px;background:#203448}.menu-button:active{transform:scale(.96)}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(25,65,100,.16);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s}.sidebar{position:fixed;z-index:110;top:0;left:0;width:285px;height:100vh;padding:22px 15px 16px;display:flex;flex-direction:column;transform:translateX(-105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);background:rgba(255,255,255,.82);border-right:1px solid rgba(120,170,220,.22);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:18px 0 45px rgba(40,120,190,.14)}.sidebar.open{transform:translateX(0)}.overlay.open{opacity:1;visibility:visible}.sidebar-brand{display:flex;align-items:center;gap:11px;padding:3px 9px 20px;border-bottom:1px solid rgba(120,170,220,.18);margin-bottom:14px}.sidebar-brand img{width:42px;height:42px;border-radius:13px;object-fit:cover}.sidebar-brand strong{font-size:15px;letter-spacing:.08em}.close-sidebar{margin-left:auto;width:34px;height:34px;border:0;border-radius:11px;background:rgba(235,245,253,.75);color:#526477;font-size:24px;line-height:1;cursor:pointer}.nav{display:flex;flex-direction:column;gap:5px;overflow:auto;padding-right:2px}.nav a{display:flex;align-items:center;min-height:43px;text-decoration:none;color:#526477;padding:11px 13px;border-radius:13px;font-size:14px;font-weight:650;transition:.18s;cursor:pointer}.nav a:hover{color:#087fe9;background:rgba(30,155,240,.08)}.nav a.active{color:#087fe9;background:rgba(30,155,240,.12);box-shadow:inset 0 0 0 1px rgba(30,155,240,.12)}.logout-wrap{margin-top:auto;padding-top:14px;border-top:1px solid rgba(120,170,220,.18)}.logout{width:100%;border:0;background:rgba(255,255,255,.5);color:#526477;text-align:left;padding:12px 13px;border-radius:13px;font:600 14px inherit;cursor:pointer}.logout:hover{background:rgba(255,80,80,.08);color:#c23d48}
.main{min-height:100vh;padding:88px 25px 45px;max-width:1240px;margin:0 auto}.topbar{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px}.topbar h1{margin:0;font-size:30px;letter-spacing:-.025em}.topbar p{margin:6px 0 0;color:var(--muted);font-size:14px}.bot-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.bot-card{position:relative;min-width:0;min-height:128px;padding:17px 16px 14px;border-radius:19px;border:1px solid rgba(255,255,255,.94);background:rgba(255,255,255,.66);box-shadow:0 17px 40px rgba(54,130,190,.10),inset 0 1px 0 rgba(255,255,255,.94);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);overflow:visible}.bot-card:before{content:"";position:absolute;left:9%;right:9%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(74,186,255,.82),transparent)}.bot-head{display:flex;align-items:flex-start;gap:8px}.bot-name{font-size:16px;font-weight:780;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:2px;flex:1}.dots{width:29px;height:29px;flex:0 0 29px;border:0;border-radius:9px;background:rgba(235,245,253,.65);color:#5d7083;font-size:19px;line-height:22px;cursor:pointer;display:grid;place-items:center}.dots:hover{background:rgba(30,155,240,.10);color:#087fe9}.bot-id{margin-top:7px;color:#718397;font-size:12px;font-weight:650;letter-spacing:.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bot-status{margin-top:22px;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:750}.status-dot{width:7px;height:7px;border-radius:50%;background:#94a4b3;box-shadow:0 0 0 3px rgba(148,164,179,.10)}.bot-status.active{color:#147c59}.bot-status.active .status-dot{background:#18a875;box-shadow:0 0 0 3px rgba(24,168,117,.11)}.bot-status.inactive{color:#718092}.empty,.loading,.error-state{padding:42px 20px;text-align:center;border-radius:20px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.58);box-shadow:0 16px 40px rgba(54,130,190,.08);color:#6b7d90}.hidden{display:none}
.bot-menu{position:absolute;right:14px;top:48px;z-index:20;width:174px;padding:6px;border-radius:14px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.9);box-shadow:0 18px 45px rgba(35,95,145,.17);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}.bot-menu button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:9px;color:#40566b;font:650 12px inherit;cursor:pointer}.bot-menu button:hover{background:rgba(30,155,240,.08);color:#087fe9}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:200;padding:11px 16px;border-radius:13px;background:rgba(25,49,69,.92);color:#fff;font-size:13px;box-shadow:0 14px 35px rgba(20,65,100,.22);transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1000px){.bot-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:720px){.main{padding:82px 16px 32px}.topbar h1{font-size:26px}.bot-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.bot-card{min-height:122px;padding:15px 14px 13px}}@media(max-width:470px){.bot-grid{grid-template-columns:1fr}.bot-card{min-height:118px}}
</style>
</head>
<body>
<div class="page-bg">
<button class="menu-button" id="menuButton" aria-label="Open sidebar" aria-controls="sidebar" aria-expanded="false"><span></span><span></span><span></span></button>
<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar" aria-label="Admin sidebar">
<div class="sidebar-brand"><img id="sidebarLogo" src="" alt="Sadeeque AI logo"><strong>SADEEQUE AI</strong><button class="close-sidebar" id="closeSidebar" aria-label="Close sidebar">×</button></div>
<nav class="nav" aria-label="Admin navigation">
<a href="./dashboard.html" data-page="Sadeeque AI Homepage">Sadeeque AI Homepage</a><a class="active" href="./all-bots.html" data-page="All Bots">All Bots</a><a href="./create-bot.html" data-page="Create Bot">Create Bot</a><a href="#" data-page="Instructions">Instructions</a><a href="#" data-page="Knowledge">Knowledge</a><a href="#" data-page="External Support Knowledge">External Support Knowledge</a><a href="#" data-page="API Keys">API Keys</a><a href="#" data-page="Settings">Settings</a><a href="#" data-page="Health">Health</a><a href="#" data-page="Webs Join">Webs Join</a>
</nav>
<div class="logout-wrap"><button class="logout" id="logoutButton">Log out</button></div>
</aside>
<main class="main">
<div class="topbar"><div><h1>All Bots</h1><p>Manage all your AI bots from one place.</p></div></div>
<section id="botGrid" class="bot-grid" aria-label="All bots"></section>
<div id="loading" class="loading">Loading bots…</div>
<div id="empty" class="empty hidden">No bots have been created yet.</div>
<div id="errorState" class="error-state hidden">Unable to load bots. Please try again.</div>
</main>
<div class="toast" id="toast"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://elvvupvcfdstkqpdtxxr.supabase.co';
const SUPABASE_KEY='sb_publishable_V_tJaxkTECrDUig_kFT7zw_VWPd8L4C';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay'),menuButton=document.getElementById('menuButton'),closeSidebar=document.getElementById('closeSidebar');
async function loadOfficialLogo(){try{const r=await fetch('./index.html',{cache:'no-store'});const h=await r.text();const m=h.match(/data:image\/jpeg;base64,([^\"]+)/);if(m)document.getElementById('sidebarLogo').src='data:image/jpeg;base64,'+m[1]}catch(e){}}
loadOfficialLogo();
function openSidebar(){sidebar.classList.add('open');overlay.classList.add('open');menuButton.setAttribute('aria-expanded','true')}
function closeDrawer(){sidebar.classList.remove('open');overlay.classList.remove('open');menuButton.setAttribute('aria-expanded','false')}
menuButton.addEventListener('click',()=>sidebar.classList.contains('open')?closeDrawer():openSidebar());closeSidebar.addEventListener('click',closeDrawer);overlay.addEventListener('click',closeDrawer);document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();document.querySelectorAll('.bot-menu').forEach(x=>x.remove())}});
document.querySelectorAll('.nav a').forEach(link=>link.addEventListener('click',e=>{if(link.getAttribute('href')==='#')e.preventDefault();closeDrawer()}));
document.getElementById('logoutButton').addEventListener('click',async()=>{const {error}=await client.auth.signOut();if(!error)window.location.href='./'});
const grid=document.getElementById('botGrid'),loading=document.getElementById('loading'),empty=document.getElementById('empty'),errorState=document.getElementById('errorState'),toast=document.getElementById('toast');
function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1800)}
function closeMenus(){document.querySelectorAll('.bot-menu').forEach(x=>x.remove())}
function makeCard(bot){const card=document.createElement('article');card.className='bot-card';const active=String(bot.status).toLowerCase()==='active';card.innerHTML=`<div class="bot-head"><div class="bot-name" title="${escapeHtml(bot.bot_name)}">${escapeHtml(bot.bot_name)}</div><button class="dots" aria-label="Bot actions" type="button">⋮</button></div><div class="bot-id">${escapeHtml(bot.bot_id)}</div><div class="bot-status ${active?'active':'inactive'}"><span class="status-dot"></span>${active?'Active':'Inactive'}</div>`;const dots=card.querySelector('.dots');dots.addEventListener('click',e=>{e.stopPropagation();closeMenus();const menu=document.createElement('div');menu.className='bot-menu';const iframeButton=document.createElement('button');iframeButton.type='button';iframeButton.textContent='Copy Iframe Code';iframeButton.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(bot.iframe_code||'');showToast('Iframe code copied')}catch(err){showToast('Could not copy iframe code')}closeMenus()});menu.appendChild(iframeButton);card.appendChild(menu)});return card}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
async function loadBots(){const {data:sessionData,error:sessionError}=await client.auth.getSession();if(sessionError||!sessionData.session){window.location.replace('./');return}const {data:profile,error:profileError}=await client.from('admin_profiles').select('is_admin').eq('id',sessionData.session.user.id).maybeSingle();if(profileError||!profile||!profile.is_admin){await client.auth.signOut();window.location.replace('./');return}const {data,error}=await client.rpc('list_bots');loading.classList.add('hidden');if(error){errorState.classList.remove('hidden');return}if(!data||data.length===0){empty.classList.remove('hidden');return}grid.innerHTML='';data.forEach(bot=>grid.appendChild(makeCard(bot)))}
document.addEventListener('click',e=>{if(!e.target.closest('.bot-card'))closeMenus()});
loadBots();
</script>
</body>
</html>
