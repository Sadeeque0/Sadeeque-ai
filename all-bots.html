ba(120,170,220,.18)}.logout{width:100%;border:0;background:rgba(255,255,255,.5);color:#526477;text-align:left;padding:12px 13px;border-radius:13px;font:600 14px inherit;cursor:pointer}
.main{min-height:100vh;padding:88px 25px 45px;max-width:1240px;margin:0 auto}.topbar{margin-bottom:26px}.topbar h1{margin:0;font-size:30px;letter-spacing:-.025em}.topbar p{margin:6px 0 0;color:var(--muted);font-size:14px}.bot-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.bot-card{position:relative;min-width:0;min-height:128px;padding:17px 16px 14px;border-radius:19px;border:1px solid rgba(255,255,255,.94);background:rgba(255,255,255,.66);box-shadow:0 17px 40px rgba(54,130,190,.10),inset 0 1px 0 rgba(255,255,255,.94);backdrop-filter:blur(22px);overflow:visible;cursor:pointer;transition:transform .16s,box-shadow .16s}.bot-card:hover{transform:translateY(-2px);box-shadow:0 21px 44px rgba(54,130,190,.14),inset 0 1px 0 rgba(255,255,255,.94)}.bot-card:before{content:"";position:absolute;left:9%;right:9%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(74,186,255,.82),transparent)}.bot-head{display:flex;align-items:flex-start;gap:8px}.bot-name{font-size:16px;font-weight:780;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.dots{width:29px;height:29px;flex:0 0 29px;border:0;border-radius:9px;background:rgba(235,245,253,.65);color:#5d7083;font-size:19px;cursor:pointer}.bot-id{margin-top:7px;color:#718397;font-size:12px;font-weight:650}.bot-status{margin-top:22px;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:750}.status-dot{width:7px;height:7px;border-radius:50%;background:#94a4b3}.bot-status.active{color:#147c59}.bot-status.active .status-dot{background:#18a875;box-shadow:0 0 0 3px rgba(24,168,117,.11)}.bot-status.inactive{color:#718092}.empty,.loading,.error-state{padding:42px 20px;text-align:center;border-radius:20px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.58);box-shadow:0 16px 40px rgba(54,130,190,.08);color:#6b7d90}.hidden{display:none}.bot-menu{position:absolute;right:14px;top:48px;z-index:20;width:174px;padding:6px;border-radius:14px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.93);box-shadow:0 18px 45px rgba(35,95,145,.17);backdrop-filter:blur(20px)}.bot-menu button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:9px;color:#40566b;font:650 12px inherit;cursor:pointer}.bot-menu button:hover{background:rgba(30,155,240,.08);color:#087fe9}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;z-index:200;padding:11px 16px;border-radius:13px;background:rgba(25,49,69,.92);color:#fff;font-size:13px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:1000px){.bot-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:720px){.main{padding:82px 16px 32px}.topbar h1{font-size:26px}.bot-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}}@media(max-width:470px){.bot-grid{grid-template-columns:1fr}}
</style></head><body><div class="page-bg"><button class="menu-button" id="menuButton" aria-label="Open sidebar" aria-expanded="false"><span></span><span></span><span></span></button><div class="overlay" id="overlay"></div><aside class="sidebar" id="sidebar"><div class="sidebar-brand"><img id="sidebarLogo" src="" alt="Sadeeque AI logo"><strong>SADEEQUE AI</strong><button class="close-sidebar" id="closeSidebar">×</button></div><nav class="nav"><a href="./dashboard.html">Sadeeque AI Homepage</a><a class="active" href="./all-bots.html">All Bots</a><a href="./create-bot.html">Create Bot</a><a href="#">Instructions</a><a href="#">Knowledge</a><a href="#">External Support Knowledge</a><a href="#">API Keys</a><a href="#">Settings</a><a href="#">Health</a><a href="#">Webs Join</a></nav><div class="logout-wrap"><button class="logout" id="logoutButton">Log out</button></div></aside><main class="main"><div class="topbar"><h1>All Bots</h1><p>Manage all your AI bots from one place.</p></div><section id="botGrid" class="bot-grid"></section><div id="loading" class="loading">Loading bots…</div><div id="empty" class="empty hidden">No bots have been created yet.</div><div id="errorState" class="error-state hidden">Unable to load bots. Please try again.</div></main><div class="toast" id="toast"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const client=supabase.createClient('https://elvvupvcfdstkqpdtxxr.supabase.co','sb_publishable_V_tJaxkTECrDUig_kFT7zw_VWPd8L4C');const sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay'),menuButton=document.getElementById('menuButton'),closeSidebar=document.getElementById('closeSidebar'),sidebarLogo=document.getElementById('sidebarLogo'),logoutButton=document.getElementById('logoutButton');async function loadOfficialLogo(){try{const r=await fetch('./index.html',{cache:'no-store'}),h=await r.text(),m=h.match(/data:image\/jpeg;base64,([^\"]+)/);if(m)sidebarLogo.src='data:image/jpeg;base64,'+m[1]}catch(e){}}loadOfficialLogo();function openSidebar(){sidebar.classList.add('open');overlay.classList.add('open');menuButton.setAttribute('aria-expanded','true')}function closeDrawer(){sidebar.classList.remove('open');overlay.classList.remove('open');menuButton.setAttribute('aria-expanded','false')}menuButton.onclick=()=>sidebar.classList.contains('open')?closeDrawer():openSidebar();closeSidebar.onclick=closeDrawer;overlay.onclick=closeDrawer;document.addEventListener('pointerdown',e=>{if(sidebar.classList.contains('open')&&!sidebar.contains(e.target)&&e.target!==menuButton)closeDrawer()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',e=>{if(a.getAttribute('href')==='#')e.preventDefault();closeDrawer()}));logoutButton.onclick=async()=>{const {error}=await client.auth.signOut();if(!error)location.href='./'};
const grid=document.getElementById('botGrid'),loading=document.getElementById('loading'),empty=document.getElementById('empty'),errorState=document.getElementById('errorState'),toast=document.getElementById('toast');function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1800)}function closeMenus(){document.querySelectorAll('.bot-menu').forEach(x=>x.remove())}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}function makeCard(bot){const card=document.createElement('article');card.className='bot-card';renderCard(card,bot);card.addEventListener('click',e=>{if(e.target.closest('.dots')||e.target.closest('.bot-menu'))return;location.href='./bot-settings.html?bot_id='+encodeURIComponent(bot.bot_id)});return card}function renderCard(card,bot){const active=String(bot.status).toLowerCase()==='active';card.innerHTML=`<div class="bot-head"><div class="bot-name">${esc(bot.bot_name)}</div><button class="dots" type="button" aria-label="Bot actions">⋮</button></div><div class="bot-id">${esc(bot.bot_id)}</div><div class="bot-status ${active?'active':'inactive'}"><span class="status-dot"></span>${active?'Active':'Inactive'}</div>`;card.querySelector('.dots').onclick=e=>{e.stopPropagation();closeMenus();const menu=document.createElement('div');menu.className='bot-menu';const action=document.createElement('button');action.textContent=active?'Disable':'Enable';action.onclick=async()=>{closeMenus();const {data,error}=await client.rpc('set_bot_status',{p_bot_id:bot.bot_id,p_enabled:!active});if(error||!data){showToast('Could not update bot status');return}bot.status=data[0]?.status||data.status;renderCard(card,bot);showToast(bot.status==='active'?'Bot enabled':'Bot disabled')};menu.appendChild(action);const pin=document.createElement('button');pin.textContent=bot.is_pinned?'Unpin':'Pin';pin.onclick=async()=>{closeMenus();const {data,error}=await client.rpc('set_bot_pinned',{p_bot_id:bot.bot_id,p_pinned:!bot.is_pinned});if(error||!data){showToast('Could not update pin');return}bot.is_pinned=data[0]?.is_pinned??data.is_pinned;await loadBots();showToast(bot.is_pinned?'Bot pinned':'Bot unpinned')};menu.appendChild(pin);const cancel=document.createElement('button');cancel.textContent='Cancel';cancel.onclick=closeMenus;menu.appendChild(cancel);card.appendChild(menu)}}
async function loadBots(){const {data:s,error:se}=await client.auth.getSession();if(se||!s.session){location.replace('./');return}const {data:p,error:pe}=await client.from('admin_profiles').select('is_admin').eq('id',s.session.user.id).maybeSingle();if(pe||!p||!p.is_admin){await client.auth.signOut();location.replace('./');return}const {data,error}=await client.rpc('list_bots');loading.classList.add('hidden');if(error){errorState.classList.remove('hidden');return}if(!data?.length){empty.classList.remove('hidden');return}grid.innerHTML='';data.forEach(b=>grid.appendChild(makeCard(b)))}document.addEventListener('click',e=>{if(!e.target.closest('.bot-card'))closeMenus()});loadBots();
