<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sadeeque AI</title><link rel="stylesheet" href="./styles.css"></head><body><main class="page"><section class="hero"><div class="brand"><div class="logo-shell"><img src="./sadeeque-logo.jpg" alt="Sadeeque AI logo"></div><div class="brand-name">SADEEQUE AI</div></div><div class="welcome"><h1>Welcome to Sadeeque AI</h1><p>Your intelligent platform for creating and managing powerful AI bots.</p></div><div class="choice-grid"><button class="glass-choice" data-view="login"><span>LOGIN</span><small>Admin access</small></button><button class="glass-choice" data-view="signup"><span>SIGN UP</span><small>Initial account setup</small></button></div></section></main><div id="authModal" class="modal hidden"><div class="modal-backdrop"></div><section class="auth-card glass"><button id="closeAuth" class="close" aria-label="Close">×</button><img class="form-logo" src="./sadeeque-logo.jpg" alt="Sadeeque AI"><div id="loginForm" class="form-view"><h2>Login</h2><p class="muted">Sign in to your Sadeeque AI admin account.</p><form id="login"><label>Email<input id="loginEmail" type="email" autocomplete="email" required></label><label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">LOGIN</button></form></div><div id="signupForm" class="form-view hidden"><h2>Initial Sign Up</h2><p class="muted">Create the single Sadeeque AI admin account.</p><form id="signup"><label>Email<input id="signupEmail" type="email" autocomplete="email" required></label><label>Password<input id="signupPassword" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirm Password<input id="signupConfirm" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary" type="submit">CREATE ACCOUNT</button></form></div><div id="status" class="status" role="alert"></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./app.js"></script></body></html>
