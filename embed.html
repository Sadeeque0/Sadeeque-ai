<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Sadeeque AI</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:10px;background:transparent}.shell{height:100%;min-height:360px;display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(120,150,180,.18);border-radius:24px;background:#fff;position:relative}.head{height:68px;flex:0 0 68px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #e1e8ef;background:rgba(255,255,255,.9)}.identity{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:38px;height:38px;flex:0 0 38px;border-radius:12px;object-fit:cover;display:block}.name{font-weight:750;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.right{display:flex;align-items:center;gap:10px}.presence{font-size:12px;color:#718096}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#98a2b3;margin-right:6px}.dot.on{background:#21b66f}.clear{width:34px;height:34px;border:1px solid #e0e8ef;border-radius:11px;background:#fff;cursor:pointer}.chat{position:relative;flex:1;overflow:auto;padding:18px 16px;background:linear-gradient(180deg,var(--bg1,#eef7ff),var(--bg2,#eaf4ff))}.ambient-ropes{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:0;opacity:.07}.ambient-ropes svg{width:100%;height:100%;display:block}.ambient-ropes path{fill:none;stroke-linecap:round;stroke-width:1.05;vector-effect:non-scaling-stroke;stroke-dasharray:150 230;animation:ropeFlow 20s linear infinite;transform-origin:center}.ambient-ropes .r1{stroke:var(--rope1);animation-duration:23s;animation-delay:-3s}.ambient-ropes .r2{stroke:var(--rope2);animation-duration:27s;animation-delay:-11s}.ambient-ropes .r3{stroke:var(--rope3);animation-duration:25s;animation-delay:-17s}.ambient-ropes .r4{stroke:var(--rope4);animation-duration:29s;animation-delay:-7s}.ambient-ropes .r5{stroke:var(--rope1);animation-duration:31s;animation-delay:-22s}.ambient-ropes .r6{stroke:var(--rope2);animation-duration:26s;animation-delay:-14s}.ambient-ropes .r7{stroke:var(--rope3);animation-duration:30s;animation-delay:-19s}.ambient-ropes .r8{stroke:var(--rope4);animation-duration:24s;animation-delay:-9s}.ambient-ropes .r9{stroke:var(--rope2);animation-duration:33s;animation-delay:-27s}.ambient-ropes .r10{stroke:var(--rope3);animation-duration:28s;animation-delay:-5s}.ambient-ropes .r11{stroke:var(--rope1);animation-duration:32s;animation-delay:-13s}.ambient-ropes .r12{stroke:var(--rope4);animation-duration:27s;animation-delay:-21s}.chat>*:not(.ambient-ropes){position:relative;z-index:1}@keyframes ropeFlow{0%{stroke-dashoffset:0;transform:translate3d(-1.5%,0,0) rotate(-.25deg)}25%{transform:translate3d(1%,1%,0) rotate(.35deg)}50%{stroke-dashoffset:-300px;transform:translate3d(2%,0,0) rotate(.2deg)}75%{transform:translate3d(-1%,-1%,0) rotate(-.35deg)}100%{stroke-dashoffset:-600px;transform:translate3d(-1.5%,0,0) rotate(-.25deg)}}.msg{max-width:78%;margin:0 0 12px;white-space:pre-wrap;word-break:break-word}.user{margin-left:auto;padding:10px 13px;border-radius:16px 16px 5px 16px;background:var(--user-bg);color:var(--user-fg);border:1px solid var(--user-border);box-shadow:0 5px 18px rgba(50,90,130,.06)}.botmsg{padding:3px 0;color:var(--bot-fg)}.errorMsg{color:var(--error-fg,#b42318);font-weight:650}.thinking{display:flex;align-items:center;gap:9px;margin:0 0 14px;padding:3px 0;color:var(--bot-fg)}.thinking img{width:30px;height:30px;border-radius:10px;object-fit:cover;animation:breathe 1.25s ease-in-out infinite}.thinking span{font-size:12px;color:var(--bot-fg);opacity:.72}.loading{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,var(--bg1,#eef7ff),var(--bg2,#eaf4ff));z-index:3}.loading img{width:48px;height:48px;border-radius:14px;object-fit:cover;animation:breathe 1.35s ease-in-out infinite}.hide{display:none!important}.error{display:none;text-align:center;color:var(--error-fg,#b42318);padding:8px 12px;font-size:13px;font-weight:600}.error.show{display:block}.composer{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 10px;border-top:1px solid #e1e8ef;background:var(--composer-bg,#fff)}.composer textarea{flex:0 0 68%;width:68%;min-width:0;height:56px;min-height:56px;max-height:56px;resize:none;border:1px solid var(--input-border);border-radius:16px;padding:10px 14px;font:inherit;outline:0;background:color-mix(in srgb,var(--input-bg) 88%,transparent);color:var(--input-fg)}.composer textarea::placeholder{color:var(--input-placeholder)}.send{width:42px;height:42px;flex:0 0 42px;border:0;border-radius:14px;background:var(--accent,#1976d2);color:#fff;cursor:pointer}.send.stop{background:#27384a}.send:disabled,.composer textarea:disabled{opacity:.55;cursor:not-allowed}.global-disabled{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;text-align:center;background:rgba(255,255,255,.99);padding:28px}.global-disabled.show{display:flex}.disabled-card{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:560px}.danger{width:82px;height:82px;border-radius:24px;display:grid;place-items:center;border:2px solid #dc2626;background:#fff1f2;color:#dc2626;font-size:48px;line-height:1;box-shadow:0 10px 30px rgba(220,38,38,.12)}.disabled-title{font-size:clamp(34px,8vw,68px);font-weight:900;letter-spacing:.08em;color:#dc2626;line-height:1}.disabled-text{font-size:14px;line-height:1.5;color:#b42318;font-weight:650}body.theme-black_blue .global-disabled,body.theme-dark .global-disabled{background:rgba(7,18,31,.99)}body.theme-black_blue .danger,body.theme-dark .danger{background:#351719}body.theme-black_blue .disabled-text,body.theme-dark .disabled-text{color:#ff8a82}@keyframes breathe{0%,100%{transform:scale(.82);opacity:.45}50%{transform:scale(1);opacity:1}}body.theme-default{--accent:#1976d2;--bg1:#eef7ff;--bg2:#eaf4ff;--rope1:#1976d2;--rope2:#54a7ff;--rope3:#6fc3ff;--rope4:#287fd7;--user-bg:#fff;--user-fg:#243447;--user-border:#d7e2eb;--bot-fg:#243447;--composer-bg:#fff;--input-bg:#fff;--input-fg:#243447;--input-border:#d3e0ea;--input-placeholder:#718096}body.theme-white_blue{--accent:#1677ff;--bg1:#fff;--bg2:#edf6ff;--rope1:#1677ff;--rope2:#48a4ff;--rope3:#79c8ff;--rope4:#2e75d0;--user-bg:#f2f7ff;--user-fg:#16365f;--user-border:#cfe1ff;--bot-fg:#18395f;--composer-bg:#fff;--input-bg:#fff;--input-fg:#18395f;--input-border:#cbdcf1;--input-placeholder:#718096}body.theme-pink_purple{--accent:#a14bff;--bg1:#fff0fa;--bg2:#f2eaff;--rope1:#a14bff;--rope2:#d05dff;--rope3:#7c69ff;--rope4:#ef72b9;--user-bg:#fff5fc;--user-fg:#5d2b78;--user-border:#eccff1;--bot-fg:#5b3471;--composer-bg:#fffaff;--input-bg:#fff;--input-fg:#5b3471;--input-border:#e8cfee;--input-placeholder:#927a9d}body.theme-black_blue{--accent:#238cff;--bg1:#102033;--bg2:#07121f;--rope1:#43a7ff;--rope2:#63d5ff;--rope3:#6d8fff;--rope4:#2fbcff;--user-bg:#18324e;--user-fg:#eaf5ff;--user-border:#2d587d;--bot-fg:#e7f3ff;--composer-bg:#0d1c2c;--input-bg:#13283e;--input-fg:#edf7ff;--input-border:#31516d;--input-placeholder:#93abc0}body.theme-green_blue{--accent:#179d91;--bg1:#effff8;--bg2:#e8f5ff;--rope1:#179d91;--rope2:#27b7e6;--rope3:#55d6b1;--rope4:#4b9dff;--user-bg:#effcf9;--user-fg:#164f4b;--user-border:#c5e9e2;--bot-fg:#1d5550;--composer-bg:#fff;--input-bg:#fff;--input-fg:#1d5550;--input-border:#cbe5e1;--input-placeholder:#718096}body.theme-orange_pink{--accent:#ef6b78;--bg1:#fff6eb;--bg2:#ffeaf3;--rope1:#ef6b78;--rope2:#ff9d72;--rope3:#d75dce;--rope4:#ff7fa6;--user-bg:#fff5ef;--user-fg:#713c42;--user-border:#f0d1c7;--bot-fg:#713c42;--composer-bg:#fffdfb;--input-bg:#fff;--input-fg:#713c42;--input-border:#efd7d0;--input-placeholder:#8d7673}body.theme-dark{--accent:#6aa9ff;--bg1:#101722;--bg2:#182536;--rope1:#6aa9ff;--rope2:#8ddcff;--rope3:#8e9dff;--rope4:#54b8ff;--user-bg:#20354d;--user-fg:#edf6ff;--user-border:#385c7c;--bot-fg:#e8f2ff;--composer-bg:#101b29;--input-bg:#172638;--input-fg:#edf6ff;--input-border:#36516b;--input-placeholder:#91a7bb}@media(max-width:520px){body{padding:0}.shell{border-radius:0}.head{padding:10px 13px}.chat{padding:15px 13px}.composer textarea{flex:0 0 68%;width:68%;min-width:0;height:56px;min-height:56px;max-height:56px}.ambient-ropes{opacity:.07}.ambient-ropes path{stroke-width:.9}.ambient-ropes .r1{transform:scaleY(1.14)}.ambient-ropes .r4{transform:scaleY(1.18)}.ambient-ropes .r7{transform:scaleY(1.16)}.ambient-ropes .r10{transform:scaleY(1.2)}.ambient-ropes .r12{transform:scaleY(1.15)}}</style></head><body class="theme-default"><main class="shell"><header id="normalHead" class="head"><div class="identity"><img id="logo" class="logo" alt="Sadeeque AI logo"><div id="name" class="name">Loading…</div></div><div class="right"><span class="presence"><i id="dot" class="dot"></i><span id="status">Checking…</span></span><button id="clear" class="clear" type="button" aria-label="Clear chat">🗑</button></div></header><section id="chat" class="chat"><div id="ambientRopes" class="ambient-ropes" aria-hidden="true"><svg viewBox="0 0 900 1000" preserveAspectRatio="none"><path class="r1 long" d="M-150 -120 C100 80 -40 330 220 560 S20 880 260 1280"/><path class="r2" d="M1020 140 C820 250 940 470 750 650 S900 900 690 1130"/><path class="r3" d="M240 -150 C410 40 180 240 390 430 S220 760 430 1160"/><path class="r4 long" d="M610 1320 C850 1050 590 820 870 560 S620 210 850 -260"/><path class="r5" d="M20 310 C220 180 320 340 140 510 S290 730 40 930"/><path class="r6" d="M930 520 C730 380 610 560 800 720 S640 950 960 1060"/><path class="r7 long" d="M-130 1280 C170 1040 -20 760 280 500 S30 120 340 -260"/><path class="r8" d="M990 820 C770 660 910 500 690 330 S850 80 610 -120"/><path class="r9" d="M455 -170 C570 40 330 250 520 470 S370 780 550 1160"/><path class="r10 long" d="M560 1320 C430 1030 730 820 480 590 S720 300 500 20 S610 -180 690 -300"/><path class="r11" d="M120 1160 C300 980 110 800 320 650 S120 410 340 250 S190 60 360 -130"/><path class="r12 long" d="M780 -150 C620 50 860 220 680 420 S850 680 650 850 S810 1030 700 1160"/></svg></div><div id="loading" class="loading"><img id="loadingLogo" alt=""></div></section><div id="error" class="error"></div><form id="form" class="composer"><textarea id="input" maxlength="4000" placeholder="Your message..." disabled></textarea><button id="send" class="send" type="submit" disabled>➤</button></form><section id="globalDisabled" class="global-disabled" aria-live="assertive"><div class="disabled-card"><div class="danger" aria-hidden="true">⚠</div><div class="disabled-title">BOTS DISABLED</div><div class="disabled-text">Sadeeque AI bots are currently disabled by the administrator.</div></div></section></main><script>const API='https://elvvupvcfdstkqpdtxxr.supabase.co/functions/v1/public-bot-chat',botId=(new URLSearchParams(location.search).get('bot_id')||'').trim(),valid=/^Sdq[A-Z0-9]{7}$/;let bot=null,ctrl=null,masterDisabled=false,resumeCandidate=false;const $=id=>document.getElementById(id);async function loadLogo(){try{const r=await fetch('./index.html?logo=1&v=5',{cache:'no-store'});if(!r.ok)throw 0;const h=await r.text(),m=h.match(/data:image\/jpeg;base64,[A-Za-z0-9+/=]+/);if(!m)throw 0;$('logo').src=m[0];$('loadingLogo').src=m[0]}catch{}}function add(t,c,e=''){const d=document.createElement('div');d.className='msg '+c+(e?' '+e:'');d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d}function thinking(){const d=document.createElement('div');d.className='thinking';const i=document.createElement('img');i.src=$('logo').src||$('loadingLogo').src;const s=document.createElement('span');s.textContent='Thinking…';d.append(i,s);$('chat').appendChild(d);return d}function controls(v){const b=masterDisabled||!bot||bot.status!=='active';$('input').disabled=!v||b;$('send').disabled=!v||b;$('clear').disabled=masterDisabled}function error(t){$('error').textContent=t||'';$('error').classList.toggle('show',!!t)}function globalOff(){masterDisabled=true;$('globalDisabled').classList.add('show');$('normalHead').classList.add('hide');$('chat').classList.add('hide');$('error').classList.add('hide');$('form').classList.add('hide');$('loading').classList.add('hide');controls(false)}function globalOn(){masterDisabled=false;$('globalDisabled').classList.remove('show');$('normalHead').classList.remove('hide');$('chat').classList.remove('hide');$('form').classList.remove('hide')}function apply(c,initial=false){bot=c;document.body.className='theme-'+(c.background_theme||'default');$('name').textContent=c.bot_name||'';const on=c.global_master_status===true,active=c.status==='active';$('status').textContent=on&&active?'Online':'Offline';$('dot').classList.toggle('on',on&&active);if(!on){globalOff();return}globalOn();if(!active){$('loading').classList.add('hide');controls(false);error('Bot unavailable');return}error('');$('loading').classList.add('hide');controls(true);if(initial)add(c.welcome_message||'','botmsg')}async function config(){const r=await fetch(API+'?bot_id='+encodeURIComponent(botId)+'&t='+Date.now(),{cache:'no-store',headers:{Accept:'application/json'}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Object.assign(new Error(d.error||'Bot configuration could not be loaded.'),{status:r.status,code:d.code});if(!d||d.bot_id!==botId)throw Object.assign(new Error('Bot not found. Check the Bot ID in the iframe code.'),{status:404});return d}function fail(t){$('status').textContent='Offline';$('dot').classList.remove('on');error(t);$('loading').classList.add('hide');controls(false)}async function boot(){await loadLogo();if(!valid.test(botId)){fail('Invalid Bot ID. This iframe cannot open a bot.');return}resumeCandidate=!!localStorage.getItem('sdq_chat_key');for(let i=0;i<3;i++){try{apply(await config(),!bot);return}catch(e){if(e.status===404){fail('Bot not found. Check the Bot ID in the iframe code.');return}}await new Promise(r=>setTimeout(r,500))}fail('Unable to connect to this bot right now. Please try again.')}function key(){let k=localStorage.getItem('sdq_chat_key');if(!k){k=crypto.randomUUID?crypto.randomUUID():String(Date.now());localStorage.setItem('sdq_chat_key',k);resumeCandidate=false}return k}function generating(v){$('input').disabled=v||masterDisabled||!bot||bot.status!=='active';$('send').disabled=false;$('send').textContent=v?'■':'➤';$('send').classList.toggle('stop',v)}function mapError(j,status){const c=j?.code||'';if(c==='MASTER_OFF'||c==='MASTER_DISABLED'||j?.error==='BOTS DISABLED')return 'BOTS DISABLED';if(c==='BOT_INACTIVE'||c==='BOT_UNAVAILABLE'||j?.error==='Bot unavailable')return 'Bot unavailable';if(c==='CHAT_LIMIT_REACHED'||c==='USER_CHAT_LIMIT_REACHED'||status===429)return 'Chat limit reached';if(c==='BOT_NOT_FOUND'||status===404)return 'Bot not found. Check the Bot ID in the iframe code.';return j?.error||'Unable to get a response right now.'}async function sendMessage(){const text=$('input').value.trim();if(!text||!bot||ctrl||masterDisabled||bot.global_master_status!==true||bot.status!=='active')return;error('');add(text,'user');$('input').value='';ctrl=new AbortController();generating(true);const wait=thinking(),out=add('','botmsg');out.style.display='none';const resume=resumeCandidate;try{const r=await fetch(API+'?bot_id='+encodeURIComponent(botId),{method:'POST',headers:{'Content-Type':'application/json','Accept':'text/event-stream'},body:JSON.stringify({bot_id:botId,message:text,user_key:key(),resume}),signal:ctrl.signal,cache:'no-store'});if(!r.ok){const j=await r.json().catch(()=>({}));wait.remove();out.remove();const m=mapError(j,r.status);if(m==='BOTS DISABLED'){globalOff();return}if(m==='Bot unavailable'){if(bot)bot.status='inactive';fail(m);return}add(m,'botmsg','errorMsg');return}if(!r.body){wait.remove();out.remove();add('Unable to get a response right now.','botmsg','errorMsg');return}const reader=r.body.getReader(),dec=new TextDecoder();let b='',received=false;while(true){const x=await reader.read();if(x.done)break;b+=dec.decode(x.value,{stream:true});const ls=b.split(/\r?\n/);b=ls.pop()||'';for(const line of ls){if(!line.startsWith('data:'))continue;const raw=line.slice(5).trim();if(!raw||raw==='[DONE]')continue;try{const j=JSON.parse(raw);if(j.error){wait.remove();out.remove();add(mapError(j,200),'botmsg','errorMsg');return}if(j.text){if(!received){received=true;wait.remove();out.style.display='block'}out.textContent+=j.text;$('chat').scrollTop=$('chat').scrollHeight}}catch{}}}if(!received){wait.remove();out.remove();add('Unable to get a response right now.','botmsg','errorMsg')}else resumeCandidate=false}catch(e){wait.remove();out.remove();if(e.name==='AbortError'){}else if(e.name==='TypeError')add('Network error','botmsg','errorMsg');else add('Unable to get a response right now. Please try again.','botmsg','errorMsg')}finally{ctrl=null;generating(false)}}$('form').addEventListener('submit',e=>{e.preventDefault();if(ctrl)ctrl.abort();else sendMessage()});$('clear').addEventListener('click',async()=>{if(ctrl||masterDisabled)return;const k=localStorage.getItem('sdq_chat_key');if(!k)return;try{const r=await fetch(API+'?bot_id='+encodeURIComponent(botId),{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({action:'clear',user_key:k}),cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||d.ok!==true)throw 0;localStorage.removeItem('sdq_chat_key');resumeCandidate=false;$('chat').querySelectorAll('.msg,.thinking').forEach(x=>x.remove());if(bot&&bot.global_master_status===true&&bot.status==='active')add(bot.welcome_message||'','botmsg');error('')}catch{error('Unable to clear this conversation right now. Please try again.')}});setInterval(async()=>{if(document.hidden||!valid.test(botId))return;try{const d=await config();apply(d,false)}catch(e){if(e.status===404)fail('Bot not found. Check the Bot ID in the iframe code')}} ,5000);boot();</script></body></html>
