<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Sadeeque AI</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:10px;background:transparent}.shell{height:100%;min-height:360px;display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(120,150,180,.18);border-radius:24px;background:#fff;position:relative}.head{height:68px;flex:0 0 68px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #e1e8ef;background:rgba(255,255,255,.9)}.identity{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:38px;height:38px;flex:0 0 38px;border-radius:12px;object-fit:cover;display:block}.name{font-weight:750;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.right{display:flex;align-items:center;gap:10px}.presence{font-size:12px;color:#718096}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#98a2b3;margin-right:6px}.dot.on{background:#21b66f}.clear{width:34px;height:34px;border:1px solid #e0e8ef;border-radius:11px;background:#fff;cursor:pointer}.chat{position:relative;flex:1;overflow:auto;padding:18px 16px;background:linear-gradient(180deg,var(--bg1,#eef7ff),var(--bg2,#eaf4ff))}.msg{max-width:78%;margin:0 0 12px;white-space:pre-wrap;word-break:break-word}.user{margin-left:auto;padding:10px 13px;border-radius:16px 16px 5px 16px;background:#fff;border:1px solid #d7e2eb}.botmsg{padding:3px 0}.errorMsg{color:#b42318;font-weight:650}.thinking{display:flex;align-items:center;gap:9px;margin:0 0 14px;padding:3px 0}.thinking img{width:30px;height:30px;border-radius:10px;object-fit:cover;animation:breathe 1.25s ease-in-out infinite}.thinking span{font-size:12px;color:#7b8b9b}.loading{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,var(--bg1,#eef7ff),var(--bg2,#eaf4ff));z-index:3}.loading img{width:48px;height:48px;border-radius:14px;object-fit:cover;animation:breathe 1.35s ease-in-out infinite}.hide{display:none!important}.error{display:none;text-align:center;color:#b42318;padding:8px 12px;font-size:13px;font-weight:600}.error.show{display:block}.composer{display:flex;gap:8px;padding:10px;border-top:1px solid #e1e8ef;background:#fff}.composer textarea{flex:1;min-height:42px;resize:none;border:1px solid #d3e0ea;border-radius:16px;padding:10px 14px;font:inherit;outline:0}.send{width:42px;height:42px;border:0;border-radius:14px;background:var(--accent,#1976d2);color:#fff;cursor:pointer}.send.stop{background:#27384a}.send:disabled,.composer textarea:disabled{opacity:.55;cursor:not-allowed}.global-disabled{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;text-align:center;background:rgba(255,255,255,.99);padding:28px}.global-disabled.show{display:flex}.disabled-card{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:560px}.danger{width:82px;height:82px;border-radius:24px;display:grid;place-items:center;border:2px solid #dc2626;background:#fff1f2;color:#dc2626;font-size:48px;line-height:1;box-shadow:0 10px 30px rgba(220,38,38,.12)}.disabled-title{font-size:clamp(34px,8vw,68px);font-weight:900;letter-spacing:.08em;color:#dc2626;line-height:1}.disabled-text{font-size:14px;line-height:1.5;color:#b42318;font-weight:650}body.theme-black_blue .global-disabled,body.theme-dark .global-disabled{background:rgba(7,18,31,.99)}body.theme-black_blue .danger,body.theme-dark .danger{background:#351719}body.theme-black_blue .disabled-text,body.theme-dark .disabled-text{color:#ff8a82}@keyframes breathe{0%,100%{transform:scale(.82);opacity:.45}50%{transform:scale(1);opacity:1}}body.theme-default{--accent:#1976d2;--bg1:#eef7ff;--bg2:#eaf4ff}body.theme-white_blue{--accent:#1677ff;--bg1:#fff;--bg2:#edf6ff}body.theme-pink_purple{--accent:#a14bff;--bg1:#fff0fa;--bg2:#f2eaff}body.theme-black_blue{--accent:#238cff;--bg1:#102033;--bg2:#07121f}body.theme-green_blue{--accent:#179d91;--bg1:#effff8;--bg2:#e8f5ff}body.theme-orange_pink{--accent:#ef6b78;--bg1:#fff6eb;--bg2:#ffeaf3}body.theme-dark{--accent:#6aa9ff;--bg1:#101722;--bg2:#182536}@media(max-width:520px){body{padding:0}.shell{border-radius:0}.head{padding:10px 13px}.chat{padding:15px 13px}}</style></head><body class="theme-default"><main class="shell"><header id="normalHead" class="head"><div class="identity"><img id="logo" class="logo" alt="Sadeeque AI logo"><div id="name" class="name">Loading…</div></div><div class="right"><span class="presence"><i id="dot" class="dot"></i><span id="status">Checking…</span></span><button id="clear" class="clear" type="button" aria-label="Clear chat">🗑</button></div></header><section id="chat" class="chat"><div id="loading" class="loading"><img id="loadingLogo" alt=""></div></section><div id="error" class="error"></div><form id="form" class="composer"><textarea id="input" maxlength="4000" placeholder="Your message..." disabled></textarea><button id="send" class="send" type="submit" disabled>➤</button></form><section id="globalDisabled" class="global-disabled" aria-live="assertive"><div class="disabled-card"><div class="danger" aria-hidden="true">⚠</div><div class="disabled-title">BOTS DISABLED</div><div class="disabled-text">Sadeeque AI bots are currently disabled by the administrator.</div></div></section></main><script>const API='https://elvvupvcfdstkqpdtxxr.supabase.co/functions/v1/public-bot-chat',botId=(new URLSearchParams(location.search).get('bot_id')||'').trim(),valid=/^Sdq[A-Z0-9]{7}$/;let bot=null,ctrl=null,masterDisabled=false;const $=id=>document.getElementById(id);async function loadLogo(){try{const r=await fetch('./index.html?logo=1&v=5',{cache:'no-store'});if(!r.ok)throw 0;const h=await r.text(),m=h.match(/data:image\/jpeg;base64,[A-Za-z0-9+/=]+/);if(!m)throw 0;$('logo').src=m[0];$('loadingLogo').src=m[0]}catch{}}function add(t,c,e=''){const d=document.createElement('div');d.className='msg '+c+(e?' '+e:'');d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d}function thinking(){const d=document.createElement('div');d.className='thinking';const i=document.createElement('img');i.src=$('logo').src||$('loadingLogo').src;const s=document.createElement('span');s.textContent='Thinking…';d.append(i,s);$('chat').appendChild(d);return d}function controls(v){const b=masterDisabled||!bot||bot.status!=='active';$('input').disabled=!v||b;$('send').disabled=!v||b;$('clear').disabled=masterDisabled}function error(t){$('error').textContent=t||'';$('error').classList.toggle('show',!!t)}function globalOff(){masterDisabled=true;$('globalDisabled').classList.add('show');$('normalHead').classList.add('hide');$('chat').classList.add('hide');$('error').classList.add('hide');$('form').classList.add('hide');$('loading').classList.add('hide');controls(false)}function globalOn(){masterDisabled=false;$('globalDisabled').classList.remove('show');$('normalHead').classList.remove('hide');$('chat').classList.remove('hide');$('form').classList.remove('hide')}function apply(c,initial=false){bot=c;document.body.className='theme-'+(c.background_theme||'default');$('name').textContent=c.bot_name||'';const on=c.global_master_status===true,active=c.status==='active';$('status').textContent=on&&active?'Online':'Offline';$('dot').classList.toggle('on',on&&active);if(!on){globalOff();return}globalOn();if(!active){$('loading').classList.add('hide');controls(false);error('Bot unavailable');return}error('');$('loading').classList.add('hide');controls(true);if(initial)add(c.welcome_message||'','botmsg')}async function config(){const r=await fetch(API+'?bot_id='+encodeURIComponent(botId)+'&t='+Date.now(),{cache:'no-store'});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Object.assign(new Error(d.error||'Bot configuration could not be loaded.'),{status:r.status,code:d.code});if(!d||d.bot_id!==botId)throw Object.assign(new Error('Bot not found. Check the Bot ID in the iframe code.'),{status:404});return d}function fail(t){$('status').textContent='Offline';$('dot').classList.remove('on');error(t);$('loading').classList.add('hide');controls(false)}async function boot(){await loadLogo();if(!valid.test(botId)){fail('Invalid Bot ID. This iframe cannot open a bot.');return}for(let i=0;i<3;i++){try{apply(await config(),!bot);return}catch(e){if(e.status===404){fail('Bot not found. Check the Bot ID in the iframe code.');return}}await new Promise(r=>setTimeout(r,500))}fail('Unable to connect to this bot right now. Please try again.')}function key(){let k=sessionStorage.getItem('sdq_chat_key');if(!k){k=crypto.randomUUID?crypto.randomUUID():String(Date.now());sessionStorage.setItem('sdq_chat_key',k)}return k}function generating(v){$('input').disabled=v||masterDisabled||!bot||bot.status!=='active';$('send').disabled=false;$('send').textContent=v?'■':'➤';$('send').classList.toggle('stop',v)}function mapError(j,status){const c=j?.code||'';if(c==='MASTER_OFF'||c==='MASTER_DISABLED'||j?.error==='BOTS DISABLED')return 'BOTS DISABLED';if(c==='BOT_INACTIVE'||c==='BOT_UNAVAILABLE'||j?.error==='Bot unavailable')return 'Bot unavailable';if(c==='CHAT_LIMIT_REACHED'||c==='USER_CHAT_LIMIT_REACHED'||status===429)return 'Chat limit reached';if(c==='BOT_NOT_FOUND'||status===404)return 'Bot not found. Check the Bot ID in the iframe code.';return j?.error||'Unable to get a response right now.'}async function sendMessage(){const text=$('input').value.trim();if(!text||!bot||ctrl||masterDisabled||bot.global_master_status!==true||bot.status!=='active')return;error('');add(text,'user');$('input').value='';ctrl=new AbortController();generating(true);const wait=thinking(),out=add('','botmsg');out.style.display='none';try{const r=await fetch(API+'?bot_id='+encodeURIComponent(botId),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bot_id:botId,message:text,user_key:key()}),signal:ctrl.signal});if(!r.ok){const j=await r.json().catch(()=>({}));wait.remove();out.remove();const m=mapError(j,r.status);if(m==='BOTS DISABLED'){globalOff();return}if(m==='Bot unavailable'){if(bot)bot.status='inactive';fail(m);return}add(m,'botmsg','errorMsg');return}if(!r.body){wait.remove();out.remove();add('Unable to get a response right now.','botmsg','errorMsg');return}const reader=r.body.getReader(),dec=new TextDecoder();let b='',received=false;while(true){const x=await reader.read();if(x.done)break;b+=dec.decode(x.value,{stream:true});const ls=b.split('\n');b=ls.pop()||'';for(const line of ls){if(!line.startsWith('data:'))continue;const raw=line.slice(5).trim();if(!raw||raw==='[DONE]')continue;try{const j=JSON.parse(raw);if(j.error){wait.remove();out.remove();add(mapError(j,200),'botmsg','errorMsg');return}if(j.text){if(!received){received=true;wait.remove();out.style.display='block'}out.textContent+=j.text;$('chat').scrollTop=$('chat').scrollHeight}}catch{}}}if(!received){wait.remove();out.remove();add('Unable to get a response right now.','botmsg','errorMsg')}}catch(e){wait.remove();out.remove();if(e.name!=='AbortError')add('Unable to get a response right now. Please try again.','botmsg','errorMsg')}finally{ctrl=null;generating(false)}}$('form').addEventListener('submit',e=>{e.preventDefault();if(ctrl)ctrl.abort();else sendMessage()});$('clear').addEventListener('click',()=>{if(!ctrl&&!masterDisabled){$('chat').querySelectorAll('.msg,.thinking').forEach(x=>x.remove());if(bot&&bot.global_master_status===true&&bot.status==='active')add(bot.welcome_message||'','botmsg')}});setInterval(async()=>{if(document.hidden||!valid.test(botId))return;try{const d=await config();apply(d,false)}catch(e){if(e.status===404)fail('Bot not found. Check the Bot ID in the iframe code.')}} ,5000);boot();</script></body></html>
