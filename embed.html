<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Sadeeque AI</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,sans-serif}body{padding:10px}.shell{height:100%;min-height:360px;display:flex;flex-direction:column;overflow:hidden;border:1px solid #dfe8f0;border-radius:24px;background:#fff}.head{height:68px;flex:0 0 68px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #e1e8ef}.identity{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:38px;height:38px;flex:0 0 38px;border-radius:12px;object-fit:cover;display:block}.name{font-weight:750;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.right{display:flex;align-items:center;gap:10px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#98a2b3;margin-right:6px}.dot.on{background:#21b66f}.presence{font-size:12px;color:#718096}.clear{width:34px;height:34px;border:1px solid #e0e8ef;border-radius:11px;background:#fff}.chat{position:relative;flex:1;overflow:auto;padding:18px 16px;background:linear-gradient(#eef7ff,#eaf4ff)}.msg{max-width:78%;margin:0 0 12px;white-space:pre-wrap;word-break:break-word}.user{margin-left:auto;padding:10px 13px;border-radius:16px 16px 5px 16px;background:#fff;border:1px solid #d7e2eb}.botmsg{padding:3px 0}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#eef7ff;z-index:3}.loading img{width:48px;height:48px;border-radius:14px;object-fit:cover}.hide{display:none}.error{display:none;text-align:center;color:#b42318;padding:8px;font-size:13px}.error.show{display:block}.composer{display:flex;gap:8px;padding:10px;border-top:1px solid #e1e8ef}textarea{flex:1;min-height:42px;resize:none;border:1px solid #d3e0ea;border-radius:16px;padding:10px 14px;font:inherit;outline:0}.send{width:42px;height:42px;border:0;border-radius:14px;background:#1976d2;color:#fff}.send:disabled,textarea:disabled{opacity:.55}@media(max-width:520px){body{padding:0}.shell{border-radius:0}.head{padding:10px 13px}.chat{padding:15px 13px}}</style></head><body><main class="shell"><header class="head"><div class="identity"><img id="logo" class="logo" alt="Sadeeque AI logo"><div id="name" class="name">Loading…</div></div><div class="right"><span class="presence"><i id="dot" class="dot"></i><span id="status">Checking…</span></span><button id="clear" class="clear" type="button">🗑</button></div></header><section id="chat" class="chat"><div id="loading" class="loading"><img id="loadingLogo" alt=""></div></section><div id="error" class="error"></div><form id="form" class="composer"><textarea id="input" maxlength="4000" placeholder="Your message..." disabled></textarea><button id="send" class="send" type="submit" disabled>➤</button></form></main><script>const U='https://elvvupvcfdstkqpdtxxr.supabase.co',K='sb_publishable_V_tJaxkTECrDUig_kFT7zw_VWPd8L4C',API=U+'/functions/v1/public-bot-chat';const db=window.supabase.createClient(U,K,{auth:{persistSession:false,autoRefreshToken:false}}),id=(new URLSearchParams(location.search).get('bot_id')||'').trim(),valid=/^Sdq[A-Z0-9]{7}$/;let bot=null,ctrl=null;const q=x=>document.getElementById(x);const logo='./sadeeque-logo.jpg';q('logo').src=logo;q('loadingLogo').src=logo;async function boot(){if(!valid.test(id))return fail('Invalid Bot ID. This iframe cannot open a bot.');for(let i=0;i<3;i++){const r=await db.from('bot_public_config').select('bot_id,bot_name,status,background_theme,welcome_message,global_master_status').eq('bot_id',id).maybeSingle();if(!r.error&&r.data&&r.data.bot_id===id){apply(r.data);q('loading').classList.add('hide');q('input').disabled=false;q('send').disabled=false;add(r.data.welcome_message||'','botmsg');return}await new Promise(x=>setTimeout(x,500))}fail('Bot not found. Check the Bot ID in the iframe code.')}function fail(t){q('status').textContent='Offline';q('error').textContent=t;q('error').classList.add('show');q('loading').classList.add('hide')}function add(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;q('chat').appendChild(d);q('chat').scrollTop=q('chat').scrollHeight;return d}function apply(c){bot=c;q('name').textContent=c.bot_name||'';const online=c.global_master_status===true&&c.status==='active';q('status').textContent=online?'Online':'Offline';q('dot').classList.toggle('on',online)}function userKey(){let k=sessionStorage.getItem('sdq_chat_key');if(!k){k=crypto.randomUUID?crypto.randomUUID():String(Date.now());sessionStorage.setItem('sdq_chat_key',k)}return k}async function sendMsg(){const t=q('input').value.trim();if(!t||!bot||ctrl)return;q('error').classList.remove('show');add(t,'user');q('input').value='';ctrl=new AbortController();q('send').textContent='■';const out=add('','botmsg');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bot_id:id,message:t,user_key:userKey()}),signal:ctrl.signal});if(!r.ok){const j=await r.json().catch(()=>({}));throw Error(j.error||'Unable to get a response.')}const reader=r.body.getReader(),dec=new TextDecoder();let b='';while(true){const z=await reader.read();if(z.done)break;b+=dec.decode(z.value,{stream:true});const ls=b.split('\n');b=ls.pop()||'';for(const l of ls){if(!l.startsWith('data:'))continue;const x=l.slice(5).trim();if(x&&x!=='[DONE]'){try{const j=JSON.parse(x);if(j.text)out.textContent+=j.text}catch{}}}}}catch(e){if(e.name!=='AbortError'){out.remove();q('error').textContent=e.message||'Unable to get a response.';q('error').classList.add('show')}}finally{ctrl=null;q('send').textContent='➤'}}q('form').addEventListener('submit',e=>{e.preventDefault();if(ctrl)ctrl.abort();else sendMsg()});q('clear').addEventListener('click',()=>{if(!ctrl){q('chat').querySelectorAll('.msg').forEach(x=>x.remove());if(bot)add(bot.welcome_message||'','botmsg')}});boot();</script></body></html>
