<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Sadeeque AI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:10px;background:transparent}.shell{height:100%;min-height:360px;display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(120,150,180,.18);border-radius:24px;background:#fff;position:relative}.head{height:68px;flex:0 0 68px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #e1e8ef;background:rgba(255,255,255,.9)}.identity{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:38px;height:38px;flex:0 0 38px;border-radius:12px;object-fit:cover;display:block}.name{font-weight:750;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.right{display:flex;align-items:center;gap:10px}.presence{font-size:12px;color:#718096}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#98a2b3;margin-right:6px}.dot.on{background:#21b66f}.clear{width:34px;height:34px;border:1px solid #e0e8ef;border-radius:11px;background:#fff;cursor:pointer}.chat{position:relative;flex:1;overflow:auto;padding:18px 16px;background:linear-gradient(180deg,var(--bg1,#eef7ff),var(--bg2,#eaf4ff))}.msg{max-width:78%;margin:0 0 12px;white-space:pre-wrap;word-break:break-word}.user{margin-left:auto;padding:10px 13px;border-radius:16px 16px 5px 16px;background:#fff;border:1px solid #d7e2eb}.botmsg{padding:3px 0}.botmsg.errorMsg{color:#b42318;font-weight:650}.loading{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,var(--bg1,#eef7ff),var(--bg2,#eaf4ff));z-index:3}.loading img{width:48px;height:48px;border-radius:14px;object-fit:cover;animation:breathe 1.35s ease-in-out infinite}.hide{display:none!important}.error{display:none;text-align:center;color:#b42318;padding:8px 12px;font-size:13px;font-weight:600}.error.show{display:block}.composer{display:flex;gap:8px;padding:10px;border-top:1px solid #e1e8ef;background:#fff}.composer textarea{flex:1;min-height:42px;resize:none;border:1px solid #d3e0ea;border-radius:16px;padding:10px 14px;font:inherit;outline:0}.send{width:42px;height:42px;border:0;border-radius:14px;background:var(--accent,#1976d2);color:#fff;cursor:pointer}.send.stop{background:#27384a}.send:disabled,.composer textarea:disabled{opacity:.55;cursor:not-allowed}.global-disabled{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;text-align:center;background:rgba(255,255,255,.99);padding:28px}.global-disabled.show{display:flex}.disabled-card{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:560px}.danger{width:82px;height:82px;border-radius:24px;display:grid;place-items:center;border:2px solid #dc2626;background:#fff1f2;color:#dc2626;font-size:48px;line-height:1;box-shadow:0 10px 30px rgba(220,38,38,.12)}.disabled-title{font-size:clamp(34px,8vw,68px);font-weight:900;letter-spacing:.08em;color:#dc2626;line-height:1}.disabled-text{font-size:14px;line-height:1.5;color:#b42318;font-weight:650}body.theme-black_blue .global-disabled,body.theme-dark .global-disabled{background:rgba(7,18,31,.99)}body.theme-black_blue .danger,body.theme-dark .danger{background:#351719}body.theme-black_blue .disabled-text,body.theme-dark .disabled-text{color:#ff8a82}@keyframes breathe{0%,100%{transform:scale(.86);opacity:.48}50%{transform:scale(1);opacity:1}}body.theme-default{--accent:#1976d2;--bg1:#eef7ff;--bg2:#eaf4ff}body.theme-white_blue{--accent:#1677ff;--bg1:#fff;--bg2:#edf6ff}body.theme-pink_purple{--accent:#a14bff;--bg1:#fff0fa;--bg2:#f2eaff}body.theme-black_blue{--accent:#238cff;--bg1:#102033;--bg2:#07121f}body.theme-green_blue{--accent:#179d91;--bg1:#effff8;--bg2:#e8f5ff}body.theme-orange_pink{--accent:#ef6b78;--bg1:#fff6eb;--bg2:#ffeaf3}body.theme-dark{--accent:#6aa9ff;--bg1:#101722;--bg2:#182536}@media(max-width:520px){body{padding:0}.shell{border-radius:0}.head{padding:10px 13px}.chat{padding:15px 13px}}
</style>
</head>
<body class="theme-default">
<main class="shell">
<header id="normalHead" class="head"><div class="identity"><img id="logo" class="logo" alt="Sadeeque AI logo"><div id="name" class="name">Loading…</div></div><div class="right"><span class="presence"><i id="dot" class="dot"></i><span id="status">Checking…</span></span><button id="clear" class="clear" type="button" aria-label="Clear chat">🗑</button></div></header>
<section id="chat" class="chat"><div id="loading" class="loading"><img id="loadingLogo" alt=""></div></section>
<div id="error" class="error"></div>
<form id="form" class="composer"><textarea id="input" maxlength="4000" placeholder="Your message..." disabled></textarea><button id="send" class="send" type="submit" disabled>➤</button></form>
<section id="globalDisabled" class="global-disabled" aria-live="assertive"><div class="disabled-card"><div class="danger" aria-hidden="true">⚠</div><div class="disabled-title">BOTS DISABLED</div><div class="disabled-text">Sadeeque AI bots are currently disabled by the administrator.</div></div></section>
</main>
<script>
const API='https://elvvupvcfdstkqpdtxxr.supabase.co/functions/v1/public-bot-chat';
const botId=(new URLSearchParams(location.search).get('bot_id')||'').trim();
const valid=/^Sdq[A-Z0-9]{7}$/;
let bot=null,ctrl=null,masterDisabled=false;
const $=id=>document.getElementById(id);

async function loadLogo(){try{const r=await fetch('./index.html?logo=1&v=3',{cache:'no-store'});if(!r.ok)throw 0;const h=await r.text(),m=h.match(/data:image\/jpeg;base64,[A-Za-z0-9+/=]+/);if(!m)throw 0;$('logo').src=m[0];$('loadingLogo').src=m[0]}catch{}}
function add(t,c,extra=''){const d=document.createElement('div');d.className='msg '+c+(extra?' '+extra:'');d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d}
function setControls(enabled){const blocked=masterDisabled||!bot||bot.status!=='active';$('input').disabled=!enabled||blocked;$('send').disabled=!enabled||blocked;$('clear').disabled=masterDisabled}
function showError(text){$('error').textContent=text||'';$('error').classList.toggle('show',!!text)}
function showGlobalDisabled(){masterDisabled=true;$('globalDisabled').classList.add('show');$('normalHead').classList.add('hide');$('chat').classList.add('hide');$('error').classList.add('hide');$('form').classList.add('hide');$('loading').classList.add('hide');$('input').disabled=true;$('send').disabled=true;$('clear').disabled=true}
function hideGlobalDisabled(){masterDisabled=false;$('globalDisabled').classList.remove('show');$('normalHead').classList.remove('hide');$('chat').classList.remove('hide');$('form').classList.remove('hide')}
function apply(c){bot=c;document.body.className='theme-'+(c.background_theme||'default');$('name').textContent=c.bot_name||'';const globalOn=c.global_master_status===true,botOn=c.status==='active';$('status').textContent=globalOn&&botOn?'Online':'Offline';$('dot').classList.toggle('on',globalOn&&botOn);if(!globalOn){showGlobalDisabled();return}hideGlobalDisabled();if(!botOn){$('loading').classList.add('hide');setControls(false);showError('Bot unavailable');return}showError('');$('loading').classList.add('hide');setControls(true)}
async function fetchConfig(){if(!valid.test(botId))return null;const r=await fetch(API+'?bot_id='+encodeURIComponent(botId)+'&t='+Date.now(),{cache:'no-store'});let data={};try{data=await r.json()}catch{}if(!r.ok)throw Object.assign(new Error(data.error||'Bot configuration could not be loaded.'),{status:r.status,code:data.code});if(!data||data.bot_id!==botId)throw Object.assign(new Error('Bot not found. Check the Bot ID in the iframe code.'),{status:404});return data}
async function boot(){await loadLogo();if(!valid.test(botId)){fail('Invalid Bot ID. This iframe cannot open a bot.');return}for(let i=0;i<3;i++){try{const data=await fetchConfig();if(data){const first=!bot;apply(data);if(first&&data.global_master_status===true&&data.status==='active')add(data.welcome_message||'','botmsg');return}}catch(e){if(e.status===404){fail('Bot not found. Check the Bot ID in the iframe code.');return}}await new Promise(r=>setTimeout(r,500))}fail('Unable to connect to this bot right now. Please try again.')}
function fail(t){$('status').textContent='Offline';$('dot').classList.remove('on');showError(t);$('loading').classList.add('hide');setControls(false)}
function userKey(){let k=sessionStorage.getItem('sdq_chat_key');if(!k){k=crypto.randomUUID?crypto.randomUUID():String(Date.now());sessionStorage.setItem('sdq_chat_key',k)}return k}
function generating(v){$('input').disabled=v||masterDisabled||!bot||bot.status!=='active';$('send').disabled=false;$('send').textContent=v?'■':'➤';$('send').classList.toggle('stop',v)}
function serverError(j,status){const code=j?.code||'';if(code==='MASTER_DISABLED'||j?.error==='BOTS DISABLED')return 'BOTS DISABLED';if(code==='BOT_UNAVAILABLE'||j?.error==='Bot unavailable')return 'Bot unavailable';if(code==='CHAT_LIMIT_REACHED'||code==='USER_CHAT_LIMIT_REACHED'||status===429)return 'Chat limit reached';if(code==='BOT_NOT_FOUND'||status===404)return 'Bot not found. Check the Bot ID in the iframe code.';return j?.error||'Unable to get a response right now.'}
async function sendMessage(){const text=$('input').value.trim();if(!text||!bot||ctrl||masterDisabled||bot.global_master_status!==true||bot.status!=='active')return;showError('');add(text,'user');$('input').value='';ctrl=new AbortController();generating(true);const out=add('','botmsg');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bot_id:botId,message:text,user_key:userKey()}),signal:ctrl.signal});if(!r.ok){const j=await r.json().catch(()=>({}));out.remove();const msg=serverError(j,r.status);if(msg==='BOTS DISABLED'){showGlobalDisabled();return}if(msg==='Bot unavailable'){if(bot)bot.status='inactive';fail(msg);return}if(msg==='Chat limit reached'){add(msg,'botmsg','errorMsg');return}if(msg.startsWith('Bot not found')){fail(msg);return}add(msg,'botmsg','errorMsg');return}if(!r.body){out.remove();add('Unable to get a response right now.','botmsg','errorMsg');return}const reader=r.body.getReader(),dec=new TextDecoder();let b='',received=false;while(true){const x=await reader.read();if(x.done)break;b+=dec.decode(x.value,{stream:true});const lines=b.split('\n');b=lines.pop()||'';for(const line of lines){if(!line.startsWith('data:'))continue;const raw=line.slice(5).trim();if(!raw||raw==='[DONE]')continue;try{const j=JSON.parse(raw);if(j.error){out.remove();add(j.error,'botmsg','errorMsg');return}if(j.text){received=true;out.textContent+=j.text;$('chat').scrollTop=$('chat').scrollHeight}}catch{}}}if(!received&&!out.textContent.trim()){out.remove();add('Unable to get a response right now.','botmsg','errorMsg')}}catch(e){if(e.name!=='AbortError'){out.remove();add('Unable to get a response right now. Please try again.','botmsg','errorMsg')}}finally{ctrl=null;generating(false)}}
$('form').addEventListener('submit',e=>{e.preventDefault();if(ctrl)ctrl.abort();else sendMessage()});
$('clear').addEventListener('click',()=>{if(!ctrl&&!masterDisabled){$('chat').querySelectorAll('.msg').forEach(x=>x.remove());if(bot&&bot.global_master_status===true&&bot.status==='active')add(bot.welcome_message||'','botmsg')}});
setInterval(async()=>{if(document.hidden||!valid.test(botId))return;try{const data=await fetchConfig();if(data){const wasMasterOff=masterDisabled;apply(data);if(wasMasterOff&&data.global_master_status===true&&data.status==='active'&&!$('chat').querySelector('.msg'))add(data.welcome_message||'','botmsg')}}catch(e){if(e.status===404)fail('Bot not found. Check the Bot ID in the iframe code.')}},5000);
boot();
</script>
</body>
</html>
