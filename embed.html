<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Sadeeque AI Bot</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--accent:#1976d2;--bg1:#eef7ff;--bg2:#eaf4ff;--ink:#142033;--muted:#718096;--border:rgba(120,150,180,.18);--panel:rgba(255,255,255,.82)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:transparent}body{padding:10px}.bot-shell{height:100%;min-height:360px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);border-radius:24px;background:linear-gradient(145deg,var(--panel),rgba(255,255,255,.55));box-shadow:0 18px 50px rgba(25,72,120,.12),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(20px)}.header{height:68px;flex:0 0 68px;display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.58)}.identity{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:38px;height:38px;flex:0 0 38px;border-radius:12px;object-fit:cover;box-shadow:0 4px 16px rgba(30,100,180,.15);background:rgba(255,255,255,.45)}.logo.thinking{animation:breathe 1.05s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(1);opacity:.72}50%{transform:scale(1.16);opacity:1}}.name{font-weight:750;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.header-actions{display:flex;align-items:center;gap:10px}.presence{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:650;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:#98a2b3;box-shadow:0 0 0 4px rgba(152,162,179,.10)}.dot.online{background:#21b66f;box-shadow:0 0 0 4px rgba(33,182,111,.12)}.clear-chat{width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(120,150,180,.16);border-radius:11px;background:rgba(255,255,255,.55);color:#718096;cursor:pointer;transition:.18s}.clear-chat:hover{transform:translateY(-1px);color:#b42318;background:rgba(255,245,245,.8)}.clear-chat svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.chat{flex:1;overflow:auto;padding:18px 16px 14px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,var(--bg1),var(--bg2));scroll-behavior:smooth}.msg{max-width:min(78%,620px);font-size:15px;line-height:1.55;word-break:break-word;white-space:pre-wrap}.msg.user{align-self:flex-end;padding:10px 13px;border-radius:16px 16px 5px 16px;background:rgba(255,255,255,.92);border:1px solid rgba(130,160,190,.25);box-shadow:0 7px 20px rgba(30,80,130,.07)}.msg.bot{align-self:flex-start;padding:3px 0;background:transparent}.msg.bot.streaming:after{content:"";display:inline-block;width:5px;height:16px;margin-left:3px;vertical-align:-3px;border-radius:3px;background:var(--accent);animation:blink .7s infinite}@keyframes blink{50%{opacity:.15}}.thinking-row{align-self:flex-start;display:none;align-items:center;gap:8px;color:var(--muted);font-size:12px}.thinking-row.show{display:flex}.mini-logo{width:24px;height:24px;border-radius:8px;object-fit:cover;animation:breathe 1.05s ease-in-out infinite}.composer{display:flex;align-items:flex-end;gap:8px;padding:10px 11px;border-top:1px solid var(--border);background:rgba(255,255,255,.76)}textarea{flex:1;resize:none;min-height:42px;max-height:110px;border:1px solid rgba(120,150,180,.26);border-radius:16px;outline:0;background:rgba(255,255,255,.72);padding:10px 14px;font:inherit;color:var(--ink);box-shadow:0 5px 16px rgba(30,80,130,.05),inset 0 1px 2px rgba(30,80,130,.04);transition:border-color .18s,box-shadow .18s,background .18s}textarea:focus{border-color:rgba(25,118,210,.42);background:rgba(255,255,255,.9);box-shadow:0 0 0 3px rgba(25,118,210,.08),0 7px 20px rgba(30,80,130,.06)}textarea::placeholder{color:#8996a5}.send{width:42px;height:42px;flex:0 0 42px;border:0;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:white;cursor:pointer;box-shadow:0 8px 18px rgba(25,118,210,.22);transition:.18s}.send:hover{transform:translateY(-1px)}.send.stop{background:#27384a}.send svg{width:19px;height:19px;fill:currentColor}.error{align-self:center;max-width:90%;font-size:13px;color:#b42318;background:rgba(255,245,245,.88);padding:8px 12px;border-radius:10px;display:none}.error.show{display:block}@media(max-width:520px){body{padding:0}.bot-shell{border-radius:0}.header{padding:10px 13px}.chat{padding:15px 13px}.msg{max-width:86%}.clear-chat{width:32px;height:32px}.presence{gap:6px}.composer{padding:9px}.send{width:40px;height:40px;flex-basis:40px}textarea{min-height:40px;padding:9px 12px}}
body.theme-default{--accent:#1976d2;--bg1:#eef7ff;--bg2:#eaf4ff}body.theme-white-blue{--accent:#1677ff;--bg1:#fff;--bg2:#edf6ff}body.theme-pink-purple{--accent:#a14bff;--bg1:#fff0fa;--bg2:#f2eaff}body.theme-black-blue{--accent:#238cff;--bg1:#102033;--bg2:#07121f;--ink:#f2f7ff;--muted:#a9b8ca;--panel:rgba(17,31,48,.82)}body.theme-green-blue{--accent:#179d91;--bg1:#effff8;--bg2:#e8f5ff}body.theme-orange-pink{--accent:#ef6b78;--bg1:#fff6eb;--bg2:#ffeaf3}body.theme-dark{--accent:#6aa9ff;--bg1:#101722;--bg2:#182536;--ink:#f4f7fb;--muted:#aab6c5;--panel:rgba(22,30,42,.86)}
</style>
</head>
<body class="theme-default">
<main class="bot-shell"><header class="header"><div class="identity"><img id="logo" class="logo" alt="Sadeeque AI logo"><div id="botName" class="name">Sadeeque AI</div></div><div class="header-actions"><div class="presence"><span id="statusDot" class="dot"></span><span id="statusText">Offline</span></div><button id="clearChat" class="clear-chat" type="button" aria-label="Clear chat" title="Clear chat"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v6m4-6v6"/></svg></button></div></header><section id="chat" class="chat"><div id="thinking" class="thinking-row"><img id="thinkingLogo" class="mini-logo" alt=""><span>Thinking…</span></div></section><div id="error" class="error"></div><form id="composer" class="composer"><textarea id="input" rows="1" maxlength="4000" placeholder="Your message..."></textarea><button id="send" class="send" type="submit" aria-label="Send"><svg id="sendIcon" viewBox="0 0 24 24"><path d="M3.4 20.6 21 12 3.4 3.4 3 10l12 2-12 2z"/></svg></button></form></main>
<script>
const API='https://elvvupvcfdstkqpdtxxr.supabase.co/functions/v1/public-bot-chat';
const SUPABASE_URL='https://elvvupvcfdstkqpdtxxr.supabase.co';
const SUPABASE_KEY='sb_publishable_V_tJaxkTECrDUig_kFT7zw_VWPd8L4C';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
const botId=new URLSearchParams(location.search).get('bot_id');let bot=null,controller=null,realtimeChannel=null;
const $=id=>document.getElementById(id),chat=$('chat'),input=$('input'),send=$('send'),error=$('error'),thinking=$('thinking');
function escTheme(t){return({default:'theme-default',white_blue:'theme-white-blue',pink_purple:'theme-pink-purple',black_blue:'theme-black-blue',green_blue:'theme-green-blue',orange_pink:'theme-orange-pink',dark:'theme-dark'})[t]||'theme-default'}
async function loadLogo(){try{const r=await fetch('./index.html?logo='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('logo');const html=await r.text();const m=html.match(/data:image\/jpeg;base64,[A-Za-z0-9+/=]+/);if(m){$('logo').src=m[0];$('thinkingLogo').src=m[0]}}catch{setTimeout(loadLogo,1500)}}
function userKey(){let k=sessionStorage.getItem('sdq_chat_key');if(!k){k=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();sessionStorage.setItem('sdq_chat_key',k)}return k}
function setStatus(active){$('statusDot').classList.toggle('online',!!active);$('statusText').textContent=active?'Online':'Offline'}
function add(text,type){const d=document.createElement('div');d.className='msg '+type;d.textContent=text;chat.insertBefore(d,thinking);chat.scrollTop=chat.scrollHeight;return d}
function showError(t){error.textContent=t;error.classList.toggle('show',!!t)}
function setGenerating(v){input.disabled=v;send.classList.toggle('stop',v);send.setAttribute('aria-label',v?'Stop':'Send');$('sendIcon').innerHTML=v?'<path d="M7 7h10v10H7z"/>':'<path d="M3.4 20.6 21 12 3.4 3.4 3 10l12 2-12 2z"/>';thinking.classList.toggle('show',v);$('logo').classList.toggle('thinking',v)}
function applyConfig(c){if(!c)return;const oldWelcome=bot?.welcome_message;const next={...(bot||{})};for(const k of ['bot_id','bot_name','status','background_theme','welcome_message','global_master_status']){if(c[k]!==undefined&&c[k]!==null)next[k]=c[k]}bot=next;if(bot.background_theme)document.body.className=escTheme(bot.background_theme);if(bot.bot_name)$('botName').textContent=bot.bot_name;setStatus(bot.global_master_status===true&&bot.status==='active');if(oldWelcome!==undefined&&bot.welcome_message!==oldWelcome){const first=[...chat.querySelectorAll('.msg.bot')][0];if(first)first.textContent=bot.welcome_message||''}}
function subscribeRealtime(){if(!botId)return;realtimeChannel=supabase.channel('bot-config-'+botId).on('postgres_changes',{event:'*',schema:'public',table:'bot_public_config',filter:'bot_id=eq.'+botId},payload=>{if(payload.new)applyConfig(payload.new)}).subscribe()}
function clearChat(){if(controller)return;chat.querySelectorAll('.msg').forEach(el=>el.remove());sessionStorage.removeItem('sdq_chat_key');showError('');if(bot?.welcome_message)add(bot.welcome_message,'bot')}
async function load(){if(!botId){showError('Invalid Bot ID.');return}await loadLogo();try{const r=await fetch(API+'?bot_id='+encodeURIComponent(botId)+'&_='+Date.now(),{cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'Bot could not be loaded.');applyConfig(j);if(bot?.welcome_message)add(bot.welcome_message,'bot');subscribeRealtime()}catch(e){showError(e.message||'Bot could not be loaded.')}}
async function sendMessage(){const text=input.value.trim();if(!text||!bot||controller)return;showError('');add(text,'user');input.value='';input.style.height='auto';setGenerating(true);controller=new AbortController();const out=add('','bot');out.classList.add('streaming');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bot_id:botId,message:text,user_key:userKey()}),signal:controller.signal});if(!r.ok){const j=await r.json().catch(()=>({}));throw Error(j.error||'Unable to get a response.')}if(!r.body)throw Error('Streaming is unavailable.');const reader=r.body.getReader(),dec=new TextDecoder();let buf='';while(true){const part=await reader.read();if(part.done)break;buf+=dec.decode(part.value,{stream:true});const lines=buf.split('\n');buf=lines.pop()||'';for(const line of lines){if(!line.startsWith('data:'))continue;const raw=line.slice(5).trim();if(!raw||raw==='[DONE]')continue;try{const j=JSON.parse(raw);if(j.text){out.textContent+=j.text;chat.scrollTop=chat.scrollHeight}}catch{}}}}catch(e){if(e.name!=='AbortError'){out.remove();showError(e.message||'Unable to get a response.')}}finally{out.classList.remove('streaming');controller=null;setGenerating(false)}}
$('composer').addEventListener('submit',e=>{e.preventDefault();if(controller){controller.abort();return}sendMessage()});$('clearChat').addEventListener('click',clearChat);input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,110)+'px'});window.addEventListener('beforeunload',()=>{if(realtimeChannel)supabase.removeChannel(realtimeChannel)});load();
</script></body></html>
