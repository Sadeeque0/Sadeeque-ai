<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Sadeeque AI</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:10px}.shell{height:100%;min-height:360px;position:relative;display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(120,150,180,.18);border-radius:24px;background:#fff}.head{height:68px;flex:0 0 68px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #e1e8ef}.identity{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:38px;height:38px;flex:0 0 38px;border-radius:12px;object-fit:cover;display:block}.name{font-weight:750;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.right{display:flex;align-items:center;gap:10px}.presence{font-size:12px;color:#718096}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#98a2b3;margin-right:6px}.dot.on{background:#21b66f}.clear{width:34px;height:34px;border:1px solid #e0e8ef;border-radius:11px;background:#fff}.chat{position:relative;flex:1;overflow:auto;padding:18px 16px;background:linear-gradient(180deg,var(--bg1,#eef7ff),var(--bg2,#eaf4ff))}.msg{max-width:78%;margin:0 0 12px;white-space:pre-wrap;word-break:break-word}.user{margin-left:auto;padding:10px 13px;border-radius:16px 16px 5px 16px;background:#fff;border:1px solid #d7e2eb}.botmsg{padding:3px 0}.loading{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,var(--bg1,#eef7ff),var(--bg2,#eaf4ff));z-index:3}.loading img{width:48px;height:48px;border-radius:14px;object-fit:cover}.hide{display:none!important}.error{display:none;text-align:center;color:#b42318;padding:8px 12px;font-size:13px;font-weight:600}.error.show{display:block}.composer{display:flex;gap:8px;padding:10px;border-top:1px solid #e1e8ef}.composer textarea{flex:1;min-height:42px;resize:none;border:1px solid #d3e0ea;border-radius:16px;padding:10px 14px;font:inherit;outline:0}.send{width:42px;height:42px;border:0;border-radius:14px;background:var(--accent,#1976d2);color:#fff}.send.stop{background:#27384a}.send:disabled,.composer textarea:disabled{opacity:.55}.global-disabled{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;background:#fff;padding:28px}.global-disabled.show{display:flex}.disabled-card{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:420px}.danger{width:74px;height:74px;border-radius:22px;display:grid;place-items:center;border:2px solid #dc2626;background:#fff1f2;color:#dc2626;font-size:42px;line-height:1;box-shadow:0 10px 30px rgba(220,38,38,.12)}.disabled-title{font-size:30px;font-weight:850;letter-spacing:.5px;color:#dc2626}.disabled-text{font-size:14px;line-height:1.5;color:#b42318}.bot-unavailable{color:#b42318;font-weight:700}.bot-limit{color:#b42318;font-weight:700}body.theme-white_blue{--accent:#1677ff;--bg1:#fff;--bg2:#edf6ff}body.theme-pink_purple{--accent:#a14bff;--bg1:#fff0fa;--bg2:#f2eaff}body.theme-black_blue{--accent:#238cff;--bg1:#102033;--bg2:#07121f}body.theme-green_blue{--accent:#179d91;--bg1:#effff8;--bg2:#e8f5ff}body.theme-orange_pink{--accent:#ef6b78;--bg1:#fff6eb;--bg2:#ffeaf3}body.theme-dark{--accent:#6aa9ff;--bg1:#101722;--bg2:#182536}@media(max-width:520px){body{padding:0}.shell{border-radius:0}.head{padding:10px 13px}.chat{padding:15px 13px}.disabled-title{font-size:25px}}</style></head><body class="theme-default"><main class="shell"><header id="normalHead" class="head"><div class="identity"><img id="logo" class="logo" alt="Sadeeque AI logo"><div id="name" class="name">Loading…</div></div><div class="right"><span class="presence"><i id="dot" class="dot"></i><span id="status">Checking…</span></span><button id="clear" class="clear" type="button">🗑</button></div></header><section id="chat" class="chat"><div id="loading" class="loading"><img id="loadingLogo" alt=""></div></section><div id="error" class="error"></div><form id="form" class="composer"><textarea id="input" maxlength="4000" placeholder="Your message..." disabled></textarea><button id="send" class="send" type="submit" disabled>➤</button></form><section id="globalDisabled" class="global-disabled" aria-live="polite"><div class="disabled-card"><div class="danger" aria-hidden="true">⚠</div><div class="disabled-title">BOTS DISABLED</div><div class="disabled-text">Sadeeque AI bots are currently disabled by the administrator.</div></div></section></main><script>const API='https://elvvupvcfdstkqpdtxxr.supabase.co/functions/v1/public-bot-chat',botId=(new URLSearchParams(location.search).get('bot_id')||'').trim(),valid=/^Sdq[A-Z0-9]{7}$/;let bot=null,ctrl=null;const $=id=>document.getElementById(id);async function loadLogo(){try{const r=await fetch('./index.html?logo=1',{cache:'no-store'});if(!r.ok)throw 0;const h=await r.text(),m=h.match(/data:image\/jpeg;base64,[A-Za-z0-9+/=]+/);if(!m)throw 0;$('logo').src=m[0];$('loadingLogo').src=m[0]}catch{}}function fail(t,cls=''){ $('status').textContent='Offline';$('dot').classList.remove('on');$('error').textContent=t;$('error').className='error show '+cls;$('loading').classList.add('hide');$('input').disabled=true;$('send').disabled=true}function add(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight;return d}function apply(c){bot=c;const online=c.global_master_status===true&&c.status==='active';$('name').textContent=c.bot_name||'';$('status').textContent=online?'Online':'Offline';$('dot').classList.toggle('on',online);document.body.className='theme-'+(c.background_theme||'default');if(c.global_master_status!==true){$('globalDisabled').classList.add('show');$('normalHead').classList.add('hide');$('chat').classList.add('hide');$('error').classList.add('hide');$('form').classList.add('hide');return}if(c.status!=='active'){fail('Bot unavailable. This bot is currently disabled.','bot-unavailable');return}$('loading').classList.add('hide');$('input').disabled=false;$('send').disabled=false;add(c.welcome_message||'','botmsg')}async function boot(){await loadLogo();if(!valid.test(botId)){fail('Invalid Bot ID. This iframe cannot open a bot.');return}for(let i=0;i<3;i++){try{const r=await fetch(API+'?bot_id='+encodeURIComponent(botId),{cache:'no-store'}),data=await r.json().catch(()=>({}));if(r.ok&&data&&data.bot_id===botId){apply(data);return}if(r.status===404){fail('Bot not found. Check the Bot ID in the iframe code.');return}}catch{}await new Promise(r=>setTimeout(r,500))}fail('Unable to connect to this bot right now. Please try again.')}function userKey(){let k=sessionStorage.getItem('sdq_chat_key');if(!k){k=crypto.randomUUID?crypto.randomUUID():String(Date.now());sessionStorage.setItem('sdq_chat_key',k)}return k}function generating(v){$('input').disabled=v;$('send').disabled=false;$('send').textContent=v?'■':'➤';$('send').classList.toggle('stop',v)}function serverError(j,status){const code=j?.code||'';if(code==='MASTER_OFF'||status===503&&j?.error==='BOTS DISABLED')return 'BOTS DISABLED';if(code==='BOT_INACTIVE'||j?.error==='Bot unavailable')return 'Bot unavailable';if(code==='CHAT_LIMIT_REACHED'||code==='USER_CHAT_LIMIT_REACHED'||status===429)return 'Chat limit reached';return j?.error||'Unable to get a response right now.'}async function sendMessage(){const text=$('input').value.trim();if(!text||!bot||ctrl||bot.global_master_status!==true||bot.status!=='active')return;$('error').classList.remove('show');add(text,'user');$('input').value='';ctrl=new AbortController();generating(true);const out=add('','botmsg');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bot_id:botId,message:text,user_key:userKey()}),signal:ctrl.signal});if(!r.ok){const j=await r.json().catch(()=>({}));out.remove();const msg=serverError(j,r.status);if(msg==='BOTS DISABLED'){showGlobalDisabled();return}if(msg==='Bot unavailable'){fail(msg,'bot-unavailable');return}if(msg==='Chat limit reached'){$('error').textContent=msg;$('error').className='error show bot-limit';return}throw Error(msg)}if(!r.body)throw Error('The bot returned no response.');const reader=r.body.getReader(),dec=new TextDecoder();let b='',received=false;while(true){const x=await reader.read();if(x.done)break;b+=dec.decode(x.value,{stream:true});const lines=b.split('\n');b=lines.pop()||'';for(const line of lines){if(!line.startsWith('data:'))continue;const raw=line.slice(5).trim();if(!raw||raw==='[DONE]')continue;try{const j=JSON.parse(raw);if(j.error)throw Error(j.error);if(j.text){received=true;out.textContent+=j.text;$('chat').scrollTop=$('chat').scrollHeight}}catch(e){if(e.message&&e.message!=='Unexpected end of JSON input')throw e}}}if(!received){out.remove();throw Error('The bot returned an empty response.')}}catch(e){if(e.name!=='AbortError'){out.remove();$('error').textContent=e.message||'Unable to get a response right now.';$('error').className='error show'}}finally{ctrl=null;generating(false)}}function showGlobalDisabled(){$('globalDisabled').classList.add('show');$('normalHead').classList.add('hide');$('chat').classList.add('hide');$('error').classList.add('hide');$('form').classList.add('hide');$('loading').classList.add('hide')}$('form').addEventListener('submit',e=>{e.preventDefault();if(ctrl)ctrl.abort();else sendMessage()});$('clear').addEventListener('click',()=>{if(!ctrl){$('chat').querySelectorAll('.msg').forEach(x=>x.remove());if(bot&&bot.global_master_status===true&&bot.status==='active')add(bot.welcome_message||'','botmsg')}});boot();</script></body></html>
