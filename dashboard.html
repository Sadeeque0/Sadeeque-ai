<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sadeeque AI Dashboard</title>
<link rel="stylesheet" href="./styles.css">
<style>
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5faff;color:#102033}
.dashboard{min-height:100vh;display:flex;background:linear-gradient(135deg,#f8fcff 0%,#eef7ff 55%,#f7fbff 100%)}
.sidebar{width:270px;min-height:100vh;padding:24px 16px;box-sizing:border-box;background:rgba(255,255,255,.72);border-right:1px solid rgba(120,170,220,.22);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:8px 0 30px rgba(40,120,190,.08)}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:4px 10px 24px;border-bottom:1px solid rgba(120,170,220,.18);margin-bottom:18px}
.sidebar-brand img{width:42px;height:42px;border-radius:13px;object-fit:cover}.sidebar-brand strong{font-size:16px;letter-spacing:.08em}.nav{display:flex;flex-direction:column;gap:7px}.nav a{display:block;text-decoration:none;color:#526477;padding:13px 14px;border-radius:13px;font-size:14px;font-weight:600;transition:.2s}.nav a:hover,.nav a.active{color:#087fe9;background:rgba(30,155,240,.1);box-shadow:inset 0 0 0 1px rgba(30,155,240,.1)}
.main{flex:1;padding:32px;box-sizing:border-box}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.topbar h1{margin:0;font-size:30px}.admin-badge{padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(120,170,220,.2);font-size:13px;color:#587086}.welcome-card{padding:34px;border-radius:24px;background:rgba(255,255,255,.68);border:1px solid rgba(255,255,255,.9);box-shadow:0 20px 50px rgba(54,130,190,.1);backdrop-filter:blur(20px)}.welcome-card h2{margin:0 0 10px;font-size:24px}.welcome-card p{margin:0;color:#65778a}
@media(max-width:760px){.dashboard{display:block}.sidebar{width:100%;min-height:auto;padding:14px}.sidebar-brand{padding-bottom:14px;margin-bottom:10px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:6px}.nav a{padding:11px;font-size:12px}.main{padding:20px}.topbar h1{font-size:24px}.admin-badge{display:none}}
</style>
</head>
<body>
<div class="dashboard">
<aside class="sidebar">
<div class="sidebar-brand"><img src="./sadeeque-logo.jpg" alt="Sadeeque AI"><strong>SADEEQUE AI</strong></div>
<nav class="nav" aria-label="Admin navigation">
<a class="active" href="./dashboard.html">Sadeeque AI Homepage</a>
<a href="#">All Bots</a>
<a href="#">Create Bot</a>
<a href="#">Instructions</a>
<a href="#">Knowledge</a>
<a href="#">External Support Knowledge</a>
<a href="#">API Keys</a>
<a href="#">Settings</a>
<a href="#">Health</a>
<a href="#">Webs Join</a>
</nav>
</aside>
<main class="main">
<div class="topbar"><h1>Dashboard</h1><span class="admin-badge">Admin</span></div>
<section class="welcome-card"><h2>Welcome to Sadeeque AI</h2><p>Your intelligent platform for creating and managing powerful AI bots.</p></section>
</main>
</div>
</body>
</html>
